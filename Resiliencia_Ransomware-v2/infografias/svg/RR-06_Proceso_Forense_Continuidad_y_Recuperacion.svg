<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200">
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#091E3A"/>
      <stop offset="60%" stop-color="#0F2C59"/>
      <stop offset="100%" stop-color="#154360"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1920" height="1200" fill="#F1F5F9"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1920" height="118" fill="url(#hdrGrad)"/>
  <rect x="0" y="118" width="1920" height="4" fill="url(#accentGrad)"/>

  <rect x="48" y="16" width="356" height="24" rx="12" fill="#1E3A5F" stroke="#38BDF8" stroke-width="1"/>
  <text x="226" y="32.5" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7DD3FC" text-anchor="middle">KIT RESILIENCIA RANSOMWARE v2.0 · INFOGRAFÍA 06 DE 08</text>

  <text x="48" y="70" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Procesos de Custodia Forense (SHA-256) y Recuperación en Zona Limpia</text>
  <text x="48" y="99" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="14" font-weight="400" fill="#BAE6FD">Coordinación simultánea entre preservación probatoria admisible (Pista A) y restitución confiable dentro de RTO/RPO (Pista B)</text>

  <rect x="1456" y="16" width="416" height="86" rx="10" fill="#0B2240" stroke="#334155" stroke-width="1.2"/>
  <text x="1474" y="38" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#38BDF8">EDICIÓN CANÓNICA v2.0 (12 NOVIEMBRE 2026)</text>
  <text x="1474" y="59" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Arquetipo: Doble Pista Secuencial + 4 Ámbitos MS</text>
  <text x="1474" y="80" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94A3B8">Guías 06 y 07 · Libro 02 · F2 y F4</text>

  <!-- Main Content -->
  <rect x="48" y="136" width="650" height="618" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
<text x="68" y="164" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0F2C59">PISTA A · EVIDENCIA Y CADENA DE CUSTODIA (GUÍA 06 · F4)</text>
<rect x="68" y="180" width="610" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="82" y="202" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.3" font-weight="700" fill="#4C1D95">1. Priorizar por volatilidad y Legal Hold</text>
<text x="82" y="221" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#334155" text-anchor="start"><tspan x="82" dy="0">Memoria, árbol EDR, logs identidad/nube/DNS, copias y notas; activar Purview Legal Hold sin avisar</tspan><tspan x="82" dy="13.4">al atacante.</tspan></text>
<rect x="68" y="256" width="610" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="82" y="278" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.3" font-weight="700" fill="#4C1D95">2. Capturar con ventana UTC y silencios</text>
<text x="82" y="297" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#334155" text-anchor="start"><tspan x="82" dy="0">Registrar EV-ID, filtros exactos y también qué fuentes NO entregaron eventos y por qué.</tspan></text>
<rect x="68" y="332" width="610" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="82" y="354" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.3" font-weight="700" fill="#4C1D95">3. Integridad SHA-256 en depósito WORM</text>
<text x="82" y="373" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#334155" text-anchor="start"><tspan x="82" dy="0">Calcular hash por copia/exportación y alojar en repositorio cifrado inmutable (nunca adjuntar</tspan><tspan x="82" dy="13.4">binarios al Excel).</tspan></text>
<rect x="68" y="408" width="610" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="82" y="430" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.3" font-weight="700" fill="#4C1D95">4. Transferencias verificadas con acuse</text>
<text x="82" y="449" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#334155" text-anchor="start"><tspan x="82" dy="0">Registrar emisor, receptor, UTC y hash comprobado; si falla integridad, frenar uso probatorio y</tspan><tspan x="82" dy="13.4">recapturar.</tspan></text>
<rect x="68" y="484" width="610" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="82" y="506" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.3" font-weight="700" fill="#4C1D95">5. Análisis sobre copias segregadas</text>
<text x="82" y="525" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#334155" text-anchor="start"><tspan x="82" dy="0">Nunca alterar el original ni abrir muestras en equipos operativos; correlación temporal !=</tspan><tspan x="82" dy="13.4">causalidad.</tspan></text>
<rect x="68" y="560" width="610" height="68" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="82" y="582" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.3" font-weight="700" fill="#4C1D95">6. Retención y disposición por Legal</text>
<text x="82" y="601" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#334155" text-anchor="start"><tspan x="82" dy="0">Conservar bajo hold regulatorio/penal; prohibido borrar logs en retención por falta de espacio.</tspan></text>
<rect x="68" y="642" width="610" height="98" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.3"/>
<text x="82" y="665" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4C1D95">ESTRUCTURA OBLIGATORIA DEL INFORME FORENSE</text>
<text x="82" y="686" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.3" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="82" dy="0">Separar estrictamente: (a) Hechos observados con EV-ID y UTC · (b) Inferencias con soporte · (c)</tspan><tspan x="82" dy="14.1">Hipótesis abiertas · (d) Lagunas de telemetría. Nunca declarar &#x27;ausencia de exfiltración&#x27; solo</tspan><tspan x="82" dy="14.1">por falta de alertas.</tspan></text>
<rect x="718" y="136" width="1154" height="618" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
<text x="740" y="164" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0F2C59">PISTA B · CONTINGENCIA Y RECUPERACIÓN CONFIABLE EN ZONA LIMPIA (GUÍA 07 · DD14 · F2)</text>
<rect x="740" y="178" width="1110" height="68" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4"/>
<rect x="752" y="190" width="214" height="24" rx="12.0" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.4"/><text x="859.0" y="206.3" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#713F12" text-anchor="middle">[GATE DD14] Modo Contingencia</text>
<text x="980" y="198" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="980" dy="0">CI + Dueño de Negocio activan operación degradada/manual cuando seguir conectado amplifica daño o la restauración superará el RTO. Numerar</tspan><tspan x="980" dy="14.4">transacciones manuales para reconciliación posterior y validar privacidad/seguridad con Legal.</tspan></text>
<rect x="740" y="260" width="546" height="108" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.3"/>
<text x="754" y="285" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">1. Fijar Límite de Confianza</text>
<text x="754" y="307" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="754" dy="0">IR delimita planos sospechosos y valida que el atacante NO controla la consola de</tspan><tspan x="754" dy="14.6">backup ni la zona limpia.</tspan></text>
<rect x="1304" y="260" width="546" height="108" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.3"/>
<text x="1318" y="285" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">2. Elegir Punto de Restauración</text>
<text x="1318" y="307" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="1318" dy="0">Comparar hora del compromiso vs última copia íntegra y RPO; si excede RPO, negocio</tspan><tspan x="1318" dy="14.6">decide reconciliación.</tspan></text>
<rect x="740" y="380" width="546" height="108" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.3"/>
<text x="754" y="405" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">3. Restituir Cimientos en Orden</text>
<text x="754" y="427" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="754" dy="0">Break-glass verificado -&gt; Identidad (AD/Entra) -&gt; DNS -&gt; Red segmentada -&gt;</tspan><tspan x="754" dy="14.6">Telemetría/EDR -&gt; Secretos -&gt; Base.</tspan></text>
<rect x="1304" y="380" width="546" height="108" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.3"/>
<text x="1318" y="405" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">4. Reconstruir Servicios Aislados</text>
<text x="1318" y="427" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="1318" dy="0">Imágenes limpias, parches, EDR activo y rotación de credenciales ANTES de abrir</tspan><tspan x="1318" dy="14.6">tráfico productivo.</tspan></text>
<rect x="740" y="500" width="546" height="108" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.3"/>
<text x="754" y="525" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">5. Prueba Funcional y Medición</text>
<text x="754" y="547" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="754" dy="0">Negocio ejecuta transacciones reales, concilia datos manuales y mide RTO y RPO</tspan><tspan x="754" dy="14.6">efectivos frente al BIA.</tspan></text>
<rect x="1304" y="500" width="546" height="108" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.3"/>
<text x="1318" y="525" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">6. Reconexión Gradual Vigilada</text>
<text x="1318" y="547" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="1318" dy="0">CI autoriza por segmento; IR vigila cero reaparición adversaria y el Dueño de</tspan><tspan x="1318" dy="14.6">Negocio firma aceptación.</tspan></text>
<rect x="740" y="620" width="1110" height="104" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.3"/>
<text x="754" y="645" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532D">7. Cierre, Evidencia y Mejora</text>
<text x="754" y="667" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="754" dy="0">Conciliar pendientes manuales, entregar evidencia a Legal y actualizar BIA, arquitectura y plan de pruebas.</tspan></text>
<rect x="48" y="770" width="1824" height="358" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
<text x="72" y="798" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0F2C59">ARQUITECTURA DE RECUPERACIÓN FULL MICROSOFT EN 4 ÁMBITOS Y CONDICIONES DE NO-REINTRODUCCIÓN</text>
<rect x="72" y="814" width="432" height="298" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="72" y="814" width="432" height="36" rx="9" fill="#1E3A5F"/>
<text x="288.0" y="837" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.4" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. Infraestructura, VMs, SQL y Archivos</text>
<text x="86" y="870" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="86" dy="0">Azure Backup inmutable + Multi-User Authorization (Resource Guard</tspan><tspan x="86" dy="14.6">en suscripción/tenant separado) + Azure Site Recovery hacia</tspan><tspan x="86" dy="14.6">Landing Zone limpia.</tspan></text>
<rect x="84" y="990" width="408" height="110" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="4,2"/>
<text x="92" y="1012" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#7F1D1D" text-anchor="start"><tspan x="92" dy="0">PROHIBIDO reconectar redes restauradas al dominio</tspan><tspan x="92" dy="13.9">comprometido antes de contener y rotar secretos (CT-02,</tspan><tspan x="92" dy="13.9">CT-07 · K28, K30, K47).</tspan></text>
<rect x="520" y="814" width="432" height="298" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="520" y="814" width="432" height="36" rx="9" fill="#1E3A5F"/>
<text x="736.0" y="837" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.4" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. Colaboración Masiva (M365)</text>
<text x="534" y="870" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="534" dy="0">Microsoft 365 Backup para restauración rápida a gran escala de</tspan><tspan x="534" dy="14.6">SharePoint, OneDrive y Exchange; Files Restore (30d) para casos</tspan><tspan x="534" dy="14.6">acotados.</tspan></text>
<rect x="532" y="990" width="408" height="110" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="4,2"/>
<text x="540" y="1012" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#7F1D1D" text-anchor="start"><tspan x="540" dy="0">Ni OneDrive Sync ni Files Restore reconstruyen Active</tspan><tspan x="540" dy="13.9">Directory, bases de datos LOB ni configuraciones SaaS (CT-20</tspan><tspan x="540" dy="13.9">· K28, K30).</tspan></text>
<rect x="968" y="814" width="432" height="298" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="968" y="814" width="432" height="36" rx="9" fill="#1E3A5F"/>
<text x="1184.0" y="837" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.4" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Plano de Identidad (AD DS y Entra)</text>
<text x="982" y="870" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="982" dy="0">Procedimiento aislado de AD Forest Recovery, cuentas break-glass</tspan><tspan x="982" dy="14.6">en Entra con FIDO2 y políticas de Acceso Condicional exportadas</tspan><tspan x="982" dy="14.6">como código.</tspan></text>
<rect x="980" y="990" width="408" height="110" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="4,2"/>
<text x="988" y="1012" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#7F1D1D" text-anchor="start"><tspan x="988" dy="0">PROHIBIDO restaurar controladores desde imágenes con</tspan><tspan x="988" dy="13.9">persistencia previa o reutilizar KRBTGT comprometido (CT-03</tspan><tspan x="988" dy="13.9">· K33, K34).</tspan></text>
<rect x="1416" y="814" width="432" height="298" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="1416" y="814" width="432" height="36" rx="9" fill="#1E3A5F"/>
<text x="1632.0" y="837" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12.4" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. Procesos Asistidos por IA y Agentes</text>
<text x="1430" y="870" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.6" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="1430" dy="0">Desacople selectivo en Entra Agent ID / Agent 365 / Copilot</tspan><tspan x="1430" dy="14.6">Studio / Foundry (PB-07) y transición inmediata a flujo</tspan><tspan x="1430" dy="14.6">determinista o manual.</tspan></text>
<rect x="1428" y="990" width="408" height="110" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="4,2"/>
<text x="1436" y="1012" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11.2" font-weight="700" fill="#7F1D1D" text-anchor="start"><tspan x="1436" dy="0">PROHIBIDO depender de un agente de IA en un proceso crítico</tspan><tspan x="1436" dy="13.9">sin ruta degradada sin IA probada anualmente (CT-21 · K29,</tspan><tspan x="1436" dy="13.9">K56).</tspan></text>

