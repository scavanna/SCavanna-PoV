  <rect x="228" y="1158" width="174" height="26" rx="13.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/><text x="315.0" y="1175.7" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A" text-anchor="middle">[DECISIÓN / GATE DD]</text>
  <rect x="414" y="1158" width="184" height="26" rx="13.0" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.4"/><text x="506.0" y="1175.7" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#713F12" text-anchor="middle">[CONDICIÓN / PARCIAL]</text>
  <rect x="610" y="1158" width="198" height="26" rx="13.0" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4,2"/><text x="709.0" y="1175.7" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#7F1D1D" text-anchor="middle">[LÍMITE / RIESGO CRÍTICO]</text>

  <text x="1872" y="1176" font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="end">Seguridad humana prevalece · Ningún artefacto autoriza cambios por sí solo · Fuente: PKG-RANSOM v2.0 (Guías 01–15)</text>
