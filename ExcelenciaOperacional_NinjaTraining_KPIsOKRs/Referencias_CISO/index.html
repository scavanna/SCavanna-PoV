const DOCS = [{"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_00_Indice_y_Guia_de_Uso_v1.0.md", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_00_Indice_y_Guia_de_Uso_v1.0.md", "ext": ".md", "sizeKB": 8.3, "content": "# Modelo Operativo CISO 365 · 00 · Índice y guía de uso\n\n**AI CISO Atlas · v1.0 · 10 de noviembre de 2026** · Cómo está organizado el modelo y por dónde empezar.\n\n\n> **Estado:** propuesta reutilizable, sujeta a ajustes por organización. Los días de cada fase son normas de diseño; las metas son de referencia (umbral E3 del catálogo de KPIs y OKRs en el año 1, E4 en el año 2).\n\n## 1. Qué es\n\nEl Modelo Operativo CISO 365 lleva el plan de los primeros 100 días a un año completo de gestión: desde la recepción del área hasta la rendición de cuentas del primer año. Separa lo que se hace **una sola vez** (instalación) de lo que **se repite cada año** (ciclo de gobierno), y sirve también como **instrumento de evaluación** de la gestión de un CISO y como **guía de entrevista** para identificar mejoras y servicios de asesoría o consultoría.\n\n## 2. Lugar en el proyecto\n\n| Capa | Qué es | Pregunta que responde | Artefactos |\n|---|---|---|---|\n| AI CISO Atlas | Corpus de conocimiento | ¿Qué hay que saber? | Taxonomía 5.3, 240 ensayos base, ontología |\n| TheNextCISO GM-24 | Mecanismo para incorporar el conocimiento | ¿Cómo se aprende y se enseña? | Formación «Gobierno y Gestión de la Ciberseguridad – The Next CISO»: 2 pilares, 12 ejes y 24 unidades (clases de 3 horas en un programa de 800 horas); Documento Maestro con 240 conceptos |\n| Modelos mentales (Biblioteca CISO de Frontera) | Herramientas que hay que aprender a usar | ¿Con qué se piensa y se decide? | Modelos mentales, prácticas de decisión, sesgos y funciones ejecutivas |\n| Modelo Operativo CISO 365 | Práctica: propuesta de operación y artefacto de rendición de cuentas | ¿Qué se hace, cuándo, quién decide y con qué evidencia? | Este conjunto de libros y documentos |\n| Catálogo de KPIs y OKRs (v1.2) | Sistema de medición | ¿Cómo se demuestra? | AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.2_2026-11-10.xlsx |\n\nEl modelo operativo es, a la vez, una **propuesta** (cómo operar el primer año y los siguientes) y el **artefacto que justifica invertir tiempo y esfuerzo en mejora continua** y permite rendir cuentas con orgullo: qué se prometió, qué se cumplió, con qué evidencia y qué se decide para el año siguiente.\n\n## 3. Mapa de artefactos\n\n| Artefacto | Para qué sirve | Contenido principal |\n|---|---|---|\n| AI_CISO_Atlas_CISO365_Plan_y_Ciclo_Anual_v1.0.xlsx | Planificar y seguir el año | Parámetros, 7 fases y hitos, 130 actividades (Plan 365), cronograma, 32 rubros de recepción, 54 rituales del ciclo anual, derechos de decisión, indicadores del plan, OKR del año 1, modelos mentales, glosario, trazabilidad GM-24, conceptos GM-24, formación de referencia, adaptación, antipatrones, fuentes y silencios |\n| AI_CISO_Atlas_CISO365_Evaluacion_y_Entrevistas_v1.0.xlsx | Evaluar la gestión y entrevistar | 51 prácticas con escala de evidencia 0 a 4, resultados por línea y por hito, plan de mejora, 56 preguntas de entrevista y 18 servicios |\n| AI_CISO_Atlas_CISO365_Tablero_Rendicion_de_Cuentas_v1.0.xlsx | Rendir cuentas | Cumplimiento de los 40 criterios de salida, 39 indicadores por pregunta del directorio, OKR del año 1, logros y compromisos del año 2 |\n| AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.2_2026-11-10.xlsx | Medir (catálogo) | 64 KPIs, 6 indicadores del sistema de gestión, estadios E1 a E5, arreglos por sector, OKR de régimen y del año 1, integración con este modelo |\n| AI_CISO_Atlas_CISO365_01_Modelo_Operativo_v1.0.md | Entender el modelo | Principios, arquitectura, qué se hace una vez y qué cada año, gobierno, medición, adaptación y antipatrones |\n| AI_CISO_Atlas_CISO365_02_Playbook_Primer_Anio_v1.0.md | Ejecutar el primer año | Fase por fase: objetivo, actividades, criterios de salida, OKR, modelos mentales y preguntas difíciles |\n| AI_CISO_Atlas_CISO365_03_Ciclo_Anual_de_Gobierno_v1.0.md | Operar desde el año 2 | Rituales por cadencia, calendario fiscal, agendas tipo y mínimo viable |\n| AI_CISO_Atlas_CISO365_04_Guia_de_Evaluacion_y_Entrevistas_v1.0.md | Evaluar y entrevistar | Ética, modos de uso, escala, procedimiento, protocolo de entrevista y de brechas a servicios |\n| AI_CISO_Atlas_CISO365_05_Plantilla_Informe_Anual_v1.0.md | Informar al directorio | Plantilla del informe anual de gobierno y gestión |\n| AI_CISO_Atlas_CISO365_06_Trazabilidad_Fuentes_y_Silencios_v1.0.md | Auditar el modelo | Cobertura de GM-24, fuentes y silencios |\n| AI_CISO_Atlas_CISO365_07_Sistema_de_Medicion_KPIs_y_OKR_v1.0.md | Medir y comprometer | Relación con el catálogo de KPIs y OKRs, indicadores del sistema de gestión, tablero y OKR del año 1 |\n| AI_CISO_Atlas_CISO365_08_Validacion_con_la_Formacion_v1.0.md | Validar con la formación | Contraste con los documentos «Formación CISO: Gobierno y Gestión»: nomenclatura, unidades de origen, cobertura de la evaluación, correcciones y recomendaciones |\n| AI_CISO_Atlas_CISO365_Catalogo_v1.0.json | Reutilizar en otras herramientas | Todo el modelo en formato estructurado, con relaciones |\n\n## 4. Tres usos\n\n| Uso | Quién | Cómo |\n|---|---|---|\n| Plan del primer año | CISO entrante o recién designado, con su sponsor | Completar Parámetros en AI_CISO_Atlas_CISO365_Plan_y_Ciclo_Anual_v1.0.xlsx, adaptar (hoja Adaptación), asignar responsables y seguir hitos, indicadores y OKR en AI_CISO_Atlas_CISO365_Tablero_Rendicion_de_Cuentas_v1.0.xlsx. |\n| Evaluación de la gestión | CISO y su equipo (autoevaluación anual, ritual R42) o un asesor externo | Puntuar las 51 prácticas con evidencia en AI_CISO_Atlas_CISO365_Evaluacion_y_Entrevistas_v1.0.xlsx; el libro calcula qué es exigible según los días en el cargo. |\n| Entrevista de descubrimiento | Asesor o consultor, en una o dos sesiones | Usar la guía de entrevista por interlocutor; las brechas se traducen en servicios sugeridos y en un plan de mejora priorizado. |\n\n## 5. Ruta de uso en siete pasos\n\n1. Acordar el mandato con el sponsor (hito H0) y fijar la fecha del día 1.\n2. Completar los parámetros de los tres libros (fechas, mes de inicio del ejercicio fiscal, tipo de llegada).\n3. Adaptar el modelo al contexto (hoja Adaptación del plan) y marcar lo que no aplica.\n4. Ejecutar las fases F1 a F3 hasta el informe de los 100 días, con la línea base del tablero y los OKR del año 1 acordados.\n5. Instalar el sistema de gobierno (F4) y probar las capacidades críticas (F5).\n6. Rendir cuentas en H365 con el tablero y la plantilla del informe anual; aprobar OKR, plan y presupuesto del año 2.\n7. Desde el año 2, operar con el ciclo anual de rituales y evaluar la gestión cada año (autoevaluación R42 y revisión del modelo R45).\n\n## 6. Convenciones\n\n| Prefijo | Qué identifica |\n|---|---|\n| F0 a F6 | Fases del primer año |\n| H0 a H365 | Hitos y sus criterios de salida (H30-1, …) |\n| ACT-### | Actividades del Plan 365 |\n| R## | Rituales del ciclo anual |\n| RC## | Rubros de recepción del área |\n| DD## | Decisiones de la matriz de derechos de decisión |\n| EV## | Prácticas de evaluación |\n| EN## | Preguntas de entrevista |\n| S## | Servicios de asesoría o consultoría |\n| K## | KPIs del catálogo de KPIs y OKRs |\n| KSG## | Indicadores del sistema de gestión del CISO (catálogo v1.2) |\n| A1-O# · A1-O#-KR# | Objetivos y resultados clave del año 1 |\n| Q1 a Q6 | Preguntas del directorio que agrupan el tablero |\n| G1.1-K01 | Conceptos de TheNextCISO GM-24 |\n| MM, DP, BIAS, EF | Herramientas de la Biblioteca CISO de Frontera |\n| F## | Fuentes del modelo |\n\n## 7. Lo que el modelo no es\n\n- No es una evaluación de desempeño individual ni reemplaza procesos de recursos humanos: evalúa el sistema de gobierno y gestión que el CISO lidera.\n- No es una auditoría ni una certificación: un puntaje alto no equivale a cumplimiento normativo.\n- No es un calendario obligatorio: los días son normas de diseño que se ajustan al contexto.\n- No reemplaza el juicio del CISO: ordena la práctica y la hace verificable.\n\n## 8. Versión y revalidación\n\nv1.0 del modelo, validada con la formación «Gobierno y Gestión de la Ciberseguridad – The Next CISO» e integrada con el catálogo de KPIs y OKRs v1.2 (10 de noviembre de 2026; la v1.1 queda como versión anterior). Revalidar fuentes y metas después de Microsoft Ignite (17 al 20 de noviembre de 2026) y de la publicación de COBIT 7, y cada año en la revisión del propio modelo (ritual R45).\n\n\n---\n@SCavanna · Principal CSA Security · Microsoft MCSA · Noviembre de 2026 · Propuesta sujeta a validación y a ajustes por organización.\n"}, {"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_01_Modelo_Operativo_v1.0.md", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_01_Modelo_Operativo_v1.0.md", "ext": ".md", "sizeKB": 17.2, "content": "# Modelo Operativo CISO 365 · 01 · Modelo operativo\n\n**AI CISO Atlas · v1.0 · 10 de noviembre de 2026** · Qué es, cómo funciona y cómo se gobierna.\n\n\n## 1. Propósito\n\nDar al CISO, a su sponsor y a quien lo acompañe un modelo para operar la función de ciberseguridad desde el primer día y durante cada año siguiente, con decisiones explícitas, evidencia y rendición de cuentas. El modelo convierte el conocimiento (AI CISO Atlas) y el aprendizaje (TheNextCISO GM-24) en práctica cotidiana, y deja trazado qué se prometió y qué se cumplió.\n\n## 2. Principios\n\n1. **Gobernar antes que operar.** El primer año instala el sistema de gobierno; las mejoras técnicas se priorizan con él, no en su lugar.\n2. **Escuchar antes de cambiar.** Durante los primeros 30 días se recibe, se estabiliza lo urgente y se escucha; los cambios estructurales esperan al diagnóstico.\n3. **Evidencia sobre declaración.** Cada hito se cierra con criterios de salida verificables; la evaluación puntúa lo que la evidencia sostiene.\n4. **El riesgo tiene dueño en el negocio.** El CISO asesora, mide y escala; las decisiones de riesgo las toma quien tiene la autoridad (matriz de derechos de decisión).\n5. **Pocas prioridades, bien hechas.** De 3 a 5 prioridades estratégicas, con dueños, recursos y resultados clave.\n6. **Una vez y cada año.** Lo que se instala una vez (fundacional) se revisa cada año; lo que se instala como rutina se repite con su cadencia.\n7. **Medir para decidir.** Cada indicador tiene línea base, dueño, fuente, meta por horizonte y un ritual que lo revisa con la frecuencia con que se mide.\n8. **Rendir cuentas con orgullo.** Se informa lo cumplido, lo pendiente y lo aprendido, con reconocimiento explícito al equipo y a las áreas.\n9. **Juicio entrenado.** Modelos mentales, prácticas de decisión y vigilancia de sesgos acompañan cada momento de decisión.\n10. **Proporcionalidad: adaptar sin perder la estructura.** El esfuerzo de seguridad se ajusta a la magnitud del riesgo y a las limitaciones prácticas de cada organización (principio de proporcionalidad que recomienda la formación de referencia); el contexto cambia ventanas, énfasis y metas, mientras las fases, los hitos y la rendición de cuentas se mantienen.\n\n## 3. Arquitectura\n\nEl modelo tiene **dos ciclos**:\n\n- **Año 1 (instalación)**, organizado por días desde la llegada: siete fases cerradas por siete hitos con criterios de salida.\n- **Año N (régimen)**, organizado por meses del ejercicio fiscal: un ciclo de rituales de gobierno y gestión que se instalan durante el año 1.\n\n| Fase | Nombre | Ventana | Objetivo | Hito | Criterios |\n|---|---|---|---|---|---|\n| F0 | Preparar | Antes del día 1 (D-30 a D0) | Llegar con un mandato explícito, una hipótesis de trabajo y la agenda de escucha preparada; no con un plan cerrado. | H0 · Mandato acordado | 5 |\n| F1 | Recibir y escuchar | Días 1–30 | Saber qué se recibe (personas, presupuesto, compromisos, riesgos abiertos), estabilizar lo urgente y escuchar a quienes deciden, sin anunciar cambios estructurales. | H30 · Acta de recepción | 5 |\n| F2 | Diagnosticar | Días 31–60 | Construir una línea base objetiva y defendible: madurez, escenarios de riesgo, servicios y activos críticos, obligaciones, capacidades y terceros. | H60 · Diagnóstico base | 6 |\n| F3 | Priorizar y comprometer | Días 61–100 | Convertir el diagnóstico en pocas prioridades con dueño, mostrar resultados tempranos y pedir explícitamente los apoyos necesarios. | H100 · Informe de los 100 días | 6 |\n| F4 | Instalar el sistema de gobierno y gestión | Días 101–180 | Formalizar decisiones (apetito, políticas, comité, dueños de riesgo, métricas, presupuesto) para que el programa funcione sin depender del CISO en cada decisión. | H180 · Sistema de gobierno operando | 7 |\n| F5 | Ejecutar y probar | Días 181–270 | Ejecutar la hoja de ruta y someter a prueba lo que se afirma: crisis, recuperación, controles, terceros e IA. | H270 · Capacidades probadas | 5 |\n| F6 | Demostrar y renovar | Días 271–365 | Rendir cuentas con evidencia, recalibrar riesgo y madurez, y convertir lo aprendido en el plan y los compromisos del año 2. | H365 · Rendición de cuentas anual | 6 |\n\nLas actividades se organizan en **13 líneas de trabajo**: los 12 ejes de TheNextCISO GM-24 (G1 a G6 de gobierno, M1 a M6 de gestión) y una línea transversal J para el juicio y la práctica del CISO.\n\n## 4. Qué se hace una vez y qué se repite cada año\n\n| Naturaleza | Actividades | Qué significa | Ejemplos |\n|---|---|---|---|\n| Única (año 1) | 26 | Se hace una sola vez, durante la instalación. | ACT-001 Investigar el negocio y su contexto; ACT-003 Mapear interesados y agendar la escucha; ACT-004 Preparar guías de conversación; ACT-005 Asegurar accesos y logística del día 1 |\n| Fundacional: se revisa cada año | 37 | Se crea en el año 1 y se revisa cada año. | ACT-002 Acordar el mandato con el sponsor; ACT-028 Elegir el marco de referencia del diagnóstico; ACT-031 Evaluar el perfil actual con evidencia; ACT-032 Identificar servicios y activos críticos |\n| Instala una rutina recurrente | 63 | Desde su instalación, se repite con la cadencia indicada. | ACT-006 Activar redes externas de intercambio; ACT-009 Iniciar el diario de decisiones del CISO; ACT-012 Instalar el sistema de gestión personal del CISO; ACT-014 Conversar 1:1 con cada líder del equipo |\n| Iniciativa de la hoja de ruta (ajustar al diagnóstico) | 4 | Mejora típica de la hoja de ruta; ajustar al diagnóstico. | ACT-087 Fortalecer la identidad; ACT-096 Proteger los datos sensibles; ACT-097 Ampliar telemetría y detección sobre activos críticos; ACT-101 Incorporar controles automatizados en el desarrollo |\n\nEn el régimen, el ciclo anual tiene **54 rituales**: 27 anual, 9 trimestral, 7 mensual, 4 por evento, 3 semanal, 3 semestral, 1 continua. El detalle está en el documento 03.\n\n## 5. Estructuras de gobierno y derechos de decisión\n\nLa matriz de derechos de decisión asigna, para 22 decisiones, quién es responsable (R), quién tiene la autoridad (A, exactamente uno), a quién se consulta (C) y a quién se informa (I), entre 11 roles.\n\n| ID | Decisión | Autoridad (A) | Responsable (R) | Nota |\n|---|---|---|---|---|\n| DD01 | Mandato, alcance y carta de la función | CEO / comité ejecutivo | CISO | La carta se revisa cada año. |\n| DD02 | Estrategia y prioridades de seguridad | CEO / comité ejecutivo | CISO | El directorio recibe la estrategia en el reporte anual. |\n| DD03 | Apetito y tolerancias al ciberriesgo | Directorio o comité del directorio | Comité de ciberriesgo; CISO; CRO / Riesgos | Ratificación al menos anual por el directorio. |\n| DD04 | Presupuesto de seguridad | CEO / comité ejecutivo | CISO; CFO / Finanzas | Explicitar el riesgo aceptado por partidas no aprobadas. |\n| DD05 | Aceptación de un riesgo fuera de tolerancia | Comité de ciberriesgo | Dueño del riesgo / negocio | Con alternativas, compensaciones y vencimiento. |\n| DD06 | Aceptación de un riesgo dentro de tolerancia | Dueño del riesgo / negocio | Dueño del riesgo / negocio | Firma del dueño del riesgo; registro obligatorio. |\n| DD07 | Excepción a una política de seguridad | CISO | Dueño del riesgo / negocio | Por encima de cierto nivel escala al comité. |\n| DD08 | Políticas corporativas de seguridad | Comité de ciberriesgo | CISO | Revisión con usuarios clave antes de aprobar. |\n| DD09 | Estándares técnicos y arquitectura de seguridad | CISO | CISO | Aplicación obligatoria en proyectos. |\n| DD10 | Declarar un incidente mayor | CISO |  | Nunca la declara un proveedor. |\n| DD11 | Aislar o desconectar un servicio crítico en un incidente | CEO / comité ejecutivo | CISO; CIO / CTO | Umbrales preautorizados en el plan de respuesta. |\n| DD12 | Notificar a reguladores y a afectados | Legal, cumplimiento y privacidad | CISO | Plazos según el inventario de obligaciones. |\n| DD13 | Comunicación pública durante una crisis | CEO / comité ejecutivo | Comunicaciones | Voceros y mensajes base preparados. |\n| DD14 | Activar continuidad o recuperación ante desastres | CEO / comité ejecutivo | CIO / CTO | Según el plan de continuidad. |\n| DD15 | Contratar o terminar un proveedor crítico de seguridad | CISO |  | Gobernado por resultados en el foro de terceros. |\n| DD16 | Incorporar un tercero crítico de negocio | Dueño del riesgo / negocio | Dueño del riesgo / negocio | Evaluación proporcional al nivel del tercero. |\n| DD17 | Aprobar un caso de uso de IA de alto riesgo | Comité de ciberriesgo | Dueño del riesgo / negocio | Evaluación previa de riesgo e impacto. |\n| DD18 | Autoridad delegada y límites de autonomía de un agente de IA | Dueño del riesgo / negocio | CIO / CTO | Dueño humano identificable para cada agente. |\n| DD19 | Plan anual de aseguramiento | Directorio o comité del directorio | Auditoría interna | Aprobado por el comité de auditoría. |\n| DD20 | Informe anual de gobierno y gestión | CISO | CISO | Lo prometido frente a lo cumplido. |\n| DD21 | Ratificación anual del apetito | Directorio o comité del directorio | Comité de ciberriesgo; CISO; CRO / Riesgos | Con los indicadores de riesgo del año. |\n| DD22 | Revisión del modelo operativo | CISO | CISO | Versionar los cambios. |\n\n## 6. Sistema de medición\n\nEl modelo usa el catálogo de KPIs y OKRs v1.2: 70 indicadores (64 del catálogo y 6 del sistema de gestión del CISO), un tablero del año 1 de 39 indicadores agrupados por seis preguntas del directorio y OKR del año 1 alineados a los hitos. Todos los indicadores tienen actividad que los instala, rituales que los revisan y metas por horizonte (E3 en el año 1, E4 en el año 2). El detalle está en el documento 07.\n\n## 7. Integración del conocimiento\n\nCada actividad está vinculada a conceptos de GM-24 (los 240 conceptos quedan ejercitados: 151 como concepto principal y 89 como complementario), a un modelo mental, una práctica de decisión y un sesgo a vigilar de la Biblioteca CISO de Frontera, a una función de NIST CSF 2.0 y a las coordenadas del AI CISO Atlas (territorio y dominio). Así, la práctica del año también es el plan de estudio del CISO y de su equipo.\n\nLas líneas de trabajo y las unidades usan la nomenclatura oficial de la formación «Gobierno y Gestión de la Ciberseguridad – The Next CISO» (estructura de 24 clases, derivada del programa de 32 unidades). Cada unidad de origen de esa formación queda cubierta por al menos una práctica de evaluación; la validación completa está en el documento 08 y en la hoja Formación de referencia del libro del plan.\n\n## 8. Adaptación\n\n| Contexto | Señales | Qué se comprime o se adelanta | Qué se extiende o se agrega | Ajuste de metas del año 1 |\n|---|---|---|---|---|\n| Caso base: CISO externo nuevo | Llega desde otra organización; no conoce la cultura ni a las personas. | — | — | Metas del año 1 en la etapa E3 del catálogo de indicadores. |\n| Promoción interna | El nuevo CISO ya era parte del equipo o de tecnología. | F1: la escucha se centra en las relaciones nuevas (directorio, pares ejecutivos), no en el diagnóstico técnico. | Recepción formal igual de obligatoria: separar lo heredado de lo propio; mentor externo. | Igual que el caso base. |\n| CISO interino | Cobertura temporal mientras se busca un titular. | F3–F6: no comprometer estrategia de largo plazo. | Continuidad de rituales existentes, urgencias y acta de traspaso para el sucesor. | Mantener lo existente; no fijar metas de año 1. |\n| vCISO o CISO fraccional | Dedicación parcial, a menudo para varias organizaciones. | Rituales semanales reemplazados por revisiones quincenales asíncronas. | Dueño interno para las decisiones indelegables; acuerdo explícito de alcance y expectativas. | Metas en E2–E3 según dedicación. |\n| Llegada después de un incidente grave | El cargo se crea o se renueva tras un incidente. | F1–F2 se comprimen: diagnóstico centrado en el incidente; M5 y M6 primero. | Comunicación inmediata con directorio y reguladores; resultados tempranos que cierren las brechas explotadas. | Metas de respuesta y recuperación en E3 al cierre; resto en E2–E3. |\n| Organización sin función previa | No hay CISO ni programa formal. | — | F2 se extiende hasta el día 90; primeras políticas, inventarios y mandato desde cero. | Metas en E2 al día 180 y E3 al día 365 en las prioridades. |\n| Sector financiero regulado | Supervisor sectorial, plazos de notificación en horas, pruebas de resiliencia. | G3 se adelanta a F1: inventario de obligaciones y relación con el supervisor desde el día 1. | Pruebas de resiliencia y de terceros con mayor frecuencia; reporte regulatorio en el calendario. | Metas regulatorias según instrumento aplicable. |\n| Industrial, energía u oil & gas (OT) | Procesos físicos, seguridad funcional y continuidad operacional. | — | Diagnóstico de OT/IoT (ISA/IEC 62443, C2M2) y ejercicios con plantas y operaciones. | Metas de OT por zona según nivel de seguridad objetivo. |\n| Organismo público | Ciclos presupuestarios rígidos, rotación política y normativa de gobierno. | — | Plan presupuestario con mayor anticipación; normativa pública de seguridad de la información. | Metas alineadas al ciclo presupuestario anual. |\n| Grupo con varias filiales o países | Múltiples jurisdicciones y entidades legales. | — | Modelo federado: comité central y foros por filial; mismo marco y método en todas. | Metas por filial y consolidadas. |\n| Organización pequeña (PyME, startup u organización sin fines de lucro) | Equipo reducido, alta tercerización. | Comités fusionados en uno; tablero de 5 a 8 indicadores. | Gobierno interno de los proveedores; decisiones indelegables con dueño interno. | Metas en E2–E3. |\n| Adopción acelerada de IA | Agentes y asistentes en procesos de negocio. | Inventario de IA en F1; política de IA en F3. | Identidad y autoridad de agentes, protección de datos para IA y pruebas adversariales. | Metas K49–K56 en E3. |\n\n## 9. Antipatrones\n\n| ID | Antipatrón | Señal de alerta | Contramedida en el modelo | Sesgo asociado |\n|---|---|---|---|---|\n| AP01 | Los 100 días como fin | Al día 180 no hay apetito aprobado ni comité con decisiones. | Hitos H180 a H365 con criterios de salida. | BIAS-0378 · Sesgo del presente |\n| AP02 | El diagnóstico eterno | Al día 75 no hay prioridades validadas. | Marco único elegido en F1; diagnóstico consolidado al día 60. | BIAS-0358 · Sesgo de sobreconfianza |\n| AP03 | Heredar sin decidir | No existe acta de recepción. | Recepción formal y decisión sobre el portafolio heredado. | BIAS-0361 · Sesgo de statu quo |\n| AP04 | Prometer sin pedir | El informe de 100 días no incluye pedidos. | Solicitud de apoyos como entregable obligatorio de H100. | BIAS-0314 · Sesgo de optimismo |\n| AP05 | El comité informativo | Actas sin decisiones registradas. | Mandato con derechos de decisión; propuestas de decisión en cada sesión. | BIAS-0149 · Pensamiento grupal |\n| AP06 | El apetito decorativo | Nadie recuerda un caso en que el apetito cambió una decisión. | Umbrales por categoría y por servicio crítico; ejemplos. | BIAS-0345 · Sesgo de riesgo cero |\n| AP07 | Métricas de vanidad | El directorio no puede tomar ninguna decisión con el reporte. | Indicadores vinculados al apetito, con meta y decisión asociada. | BIAS-0041 · Efecto de encuadre |\n| AP08 | Resultados tempranos cosméticos | No hay medición antes y después. | Criterio de reducción de riesgo para elegir resultados tempranos. | BIAS-0169 · Sesgo de acción |\n| AP09 | El CISO dueño de todo el riesgo | Todos los riesgos tienen al CISO como dueño. | Dueños de riesgo en el negocio con RACI aprobada. | BIAS-0197 · Sesgo de autoridad |\n| AP10 | El héroe operativo | Menos del 25% de la agenda en gobierno y negocio. | Agenda protegida; delegación; modelo interno y tercerizado. | BIAS-0378 · Sesgo del presente |\n| AP11 | Comprar antes de decidir | Licencias sin uso; capacidades ociosas. | Inventario de capacidades existentes antes de cualquier compra. | BIAS-0315 · Sesgo de optimismo falaz en herramientas nuevas |\n| AP12 | Copiar el marco de otra organización | Políticas inaplicables y excepciones masivas. | Adaptación explícita del marco al contexto y al apetito. | BIAS-0003 · Anclaje |\n| AP13 | Criticar al predecesor | El equipo se pone a la defensiva y oculta información. | Reconocer lo que funciona; foco en decisiones futuras. | BIAS-0411 · Sesgo retrospectivo |\n| AP14 | Ignorar la IA no autorizada | No existe inventario de IA ni política. | Inventario de IA en F2; política de IA en F4. | BIAS-0212 · Sesgo de complacencia por ausencia de incidentes recientes |\n| AP15 | El informe de logros | No se mencionan compromisos no cumplidos. | Lo prometido frente a lo cumplido como estructura obligatoria del informe. | BIAS-0185 · Sesgo de atribución |\n\n## 10. Gobierno del propio modelo\n\n- El modelo se revisa cada año (ritual R45, revisión del modelo operativo) con los resultados de la autoevaluación (R42) y del tablero.\n- Los cambios se versionan: v1.0 es la línea base; cada versión registra qué cambió y por qué.\n- Las referencias internas de Microsoft (libro de evaluación, hoja Servicios) son de uso del asesor y se retiran antes de compartir con el cliente.\n- Los silencios y límites (documento 06) se revisan con cada versión.\n\n\n---\n@SCavanna · Principal CSA Security · Microsoft MCSA · Noviembre de 2026 · Propuesta sujeta a validación y a ajustes por organización.\n"}, {"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_02_Playbook_Primer_Anio_v1.0.md", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_02_Playbook_Primer_Anio_v1.0.md", "ext": ".md", "sizeKB": 49.2, "content": "# Modelo Operativo CISO 365 · 02 · Playbook del primer año\n\n**AI CISO Atlas · v1.0 · 10 de noviembre de 2026** · Fase por fase, desde la preparación hasta la rendición de cuentas.\n\n\nCada fase tiene un objetivo, una pregunta que guía, actividades con su naturaleza (U única, RA fundacional con revisión anual, RR rutina recurrente, IN iniciativa), un hito con criterios de salida y los OKR del año 1 que se cierran en ese hito. Los días son normas de diseño. El detalle operativo está en la hoja Plan 365 de AI_CISO_Atlas_CISO365_Plan_y_Ciclo_Anual_v1.0.xlsx.\n\n## F0 · Preparar · Antes del día 1 (D-30 a D0)\n\n**Objetivo.** Llegar con un mandato explícito, una hipótesis de trabajo y la agenda de escucha preparada; no con un plan cerrado.\n\n**Pregunta que guía.** ¿Qué se espera de mí, con qué autoridad y frente a quién respondo?\n\n**Trampa típica.** Llegar con la solución decidida o aceptar el cargo sin acordar alcance, línea de reporte y acceso al directorio.\n\n*Equivalencias:* Gartner Prepare · CLI S.U.P.E.R. Start-up · programa de 12 meses Trimestre 1 · Comprender.\n\n### Actividades (9)\n\n| ID | Actividad | Días | Naturaleza | Entregable o evidencia | Decide o aprueba | Indicadores |\n|---|---|---|---|---|---|---|\n| ACT-001 | Investigar el negocio y su contexto | -30 a -5 | U | Perfil de contexto organizacional (hipótesis a validar) | CISO | — |\n| ACT-002 | Acordar el mandato con el sponsor | -30 a 0 | RA | Minuta de mandato (alcance, reporte, decisiones, expectativas) y declaración de conflictos de interés | Sponsor (CEO u otro ejecutivo) | K14; KSG06 |\n| ACT-003 | Mapear interesados y agendar la escucha | -25 a 0 | U | Mapa de interesados priorizado y agenda de las dos primeras semanas | CISO | — |\n| ACT-004 | Preparar guías de conversación | -20 a 0 | U | Guías de entrevista por interlocutor | CISO | — |\n| ACT-005 | Asegurar accesos y logística del día 1 | -15 a 0 | U | Lista de accesos y repositorios confirmada | Sponsor | — |\n| ACT-006 | Activar redes externas de intercambio | -15 a 30 | RR | Membresías y contactos activos; fuentes de inteligencia seleccionadas | CISO | — |\n| ACT-007 | Preparar la presentación personal y el mensaje inicial | -10 a 0 | U | Nota de presentación y mensaje del día 1 | CISO | — |\n| ACT-008 | Hacer el pre-mortem personal del primer año | -10 a 0 | U | Pre-mortem personal y criterios de cambio de opinión | CISO | — |\n| ACT-009 | Iniciar el diario de decisiones del CISO | -5 a 365 | RR | Diario de decisiones en uso | CISO | K03; K01 |\n\n### Hito H0 · Mandato acordado (día 0)\n\n- **H0-1.** Alcance de la función acordado por escrito con el sponsor (qué incluye y qué no). *Evidencia:* Minuta o correo de mandato.\n- **H0-2.** Línea de reporte, acceso al directorio o a su comité y derechos de decisión explicitados. *Evidencia:* Minuta de mandato; organigrama.\n- **H0-3.** Expectativas de los primeros 100 días acordadas, incluido lo que no se espera. *Evidencia:* Minuta de mandato.\n- **H0-4.** Agenda de escucha de las dos primeras semanas agendada con los interlocutores priorizados. *Evidencia:* Agenda y mapa de interesados.\n- **H0-5.** Acceso a información, repositorios y herramientas garantizado para el día 1. *Evidencia:* Lista de accesos confirmada.\n\n**Momentos de decisión y herramientas de pensamiento**\n\n| Momento | Pregunta | Modelo mental | Práctica de decisión | Sesgo a vigilar | Función ejecutiva | Cómo usarlo |\n|---|---|---|---|---|---|---|\n| Aceptar el mandato | ¿Qué espera quien me contrata y qué incentivos tiene? | MM-0136 · Problema principal-agente | DP-0040 · Establecimiento de criterios claros de decisión | BIAS-0314 · Sesgo de optimismo | EF-0021 · Planificación | Escribir el mandato y contrastarlo con dos interlocutores distintos antes del día 1. |\n| Formular la hipótesis del año | ¿Qué haría fracasar este primer año? | MM-0061 · Inversión | DP-0098 · Premortem | BIAS-0103 · Falacia de planificación | EF-0021 · Planificación | Pre-mortem escrito con señales de alerta y criterios de cambio de opinión. |\n\n\n## F1 · Recibir y escuchar · Días 1–30\n\n**Objetivo.** Saber qué se recibe (personas, presupuesto, compromisos, riesgos abiertos), estabilizar lo urgente y escuchar a quienes deciden, sin anunciar cambios estructurales.\n\n**Pregunta que guía.** ¿Qué recibí, qué está ardiendo y qué esperan de esta función quienes deciden?\n\n**Trampa típica.** Confundir la escucha con pasividad, o actuar sobre lo urgente sin registrar lo recibido y sin separar herencia de gestión propia.\n\n*Equivalencias:* Gartner Prepare · Assess · CLI S.U.P.E.R. Start-up · Understand · programa de 12 meses Trimestre 1 · Comprender.\n\n### Actividades (21)\n\n| ID | Actividad | Días | Naturaleza | Entregable o evidencia | Decide o aprueba | Indicadores |\n|---|---|---|---|---|---|---|\n| ACT-010 | Reunirse con todo el equipo de seguridad | 1 a 3 | U | Mensaje al equipo y principios de trabajo | CISO | K13 |\n| ACT-011 | Verificar la preparación mínima ante incidentes | 1 a 7 | U | Checklist de preparación mínima con brechas y dueños | CISO | K32 |\n| ACT-012 | Instalar el sistema de gestión personal del CISO | 1 a 20 | RR | Agenda tipo y tablero de compromisos del CISO | CISO | K02 |\n| ACT-013 | Recibir formalmente el área | 1 a 30 | U | Checklist de recepción completo con estado por rubro | CISO | — |\n| ACT-014 | Conversar 1:1 con cada líder del equipo | 2 a 21 | RR | Notas de 1:1 y map etito aprobado no hay contra qué comparar.\n- *Comité de auditoría y riesgos:* «¿Qué excepciones y aceptaciones de riesgo están vigentes, cuáles vencieron y quién las aprobó?» — Quiere saber si el riesgo residual se acepta con autoridad y si las excepciones se vuelven permanentes.\n- *CFO, finanzas y tesorería:* «¿Qué retorno tuvo el presupuesto de seguridad que aprobamos el año pasado?» — Quiere ver resultados, no gasto ejecutado.\n- *Legal, cumplimiento y privacidad:* «¿Cuántas políticas tenemos y cuántas se cumplen de verdad?» — Sospecha de un cuerpo normativo extenso y poco verificable.\n- *Directorio:* «¿Cómo supervisamos la IA y los agentes que ya operan en la compañía, y quién responde por ellos?» — Quiere saber si existe rendición de cuentas y visibilidad sobre un patrimonio que crece fuera de los proyectos formales.\n- *Comité de auditoría y riesgos:* «¿Qué cambió en el riesgo desde la última sesión que deberíamos saber?» — Quiere un informe vivo, no una repetición del anterior.\n\n## F5 · Ejecutar y probar · Días 181–270\n\n**Objetivo.** Ejecutar la hoja de ruta y someter a prueba lo que se afirma: crisis, recuperación, controles, terceros e IA.\n\n**Pregunta que guía.** ¿Lo que decimos que tenemos funciona cuando se lo exige?\n\n**Trampa típica.** Confundir actividad con efectividad: controles configurados que nunca se probaron y planes que nadie ensayó.\n\n*Equivalencias:* Gartner Act · Measure · Communicate · CLI S.U.P.E.R. Execute · Results · programa de 12 meses Trimestre 3 · Ejecutar.\n\n### Actividades (14)\n\n| ID | Actividad | Días | Naturaleza | Entregable o evidencia | Decide o aprueba | Indicadores |\n|---|---|---|---|---|---|---|\n| ACT-103 | Evaluar los terceros críticos | 181 a 260 | RR | Evaluaciones de terceros críticos con plan | Comité de ciberriesgo | K31 |\n| ACT-104 | Ejecutar la hoja de ruta con gestión de portafolio | 181 a 365 | RR | Informe mensual de avance | CISO | K18 |\n| ACT-105 | Revisar los incidentes significativos | 181 a olíticas; R40 Plan de capacidades y desarrollo del equipo |\n| 3 | 20 | R12 Comité de ciberriesgo; R13 Reporte al directorio o a su comité; R14 Revisión trimestral de OKR y hoja de ruta; R15 Nota trimestral de amenazas e industria; R16 Recertificación de accesos privilegiados, no humanos y de agentes; R17 Pruebas de restauración de respaldos; R18 Formación ejecutiva en ciberriesgo; R19 Revisión de calibración del juicio; R20 Seguimiento de cumplimiento y reguladores |\n| 4 | 13 | R36 Evaluación anual de terceros críticos; R37 Revisión anual de IA y agentes |\n| 5 | 12 | R32 Actualización del BIA y de los activos críticos |\n| 6 | 24 | R12 Comité de ciberriesgo; R13 Reporte al directorio o a su comité; R14 Revisión trimestral de OKR y hoja de ruta; R15 Nota trimestral de amenazas e industria; R16 Recertificación de accesos privilegiados, no humanos y de agentes; R17 Pruebas de restauración de respaldos; R18 Formación ejecutiva en ciberriesgo; R19 Revisión de calibración del juicio; R20 Seguimiento de cumplimiento y reguladores; R21 Revisión semestral del programa con el sponsor; R22 Ejercicio de mesa del equipo de respuesta; R23 Revisión semestral con la gestión de riesgos de la empresa; R35 Pruebas de controles y de penetración |\n| 7 | 13 | R34 Prueba anual de continuidad y recuperación; R39 Benchmark sectorial |\n| 8 | 13 | R33 Ejercicio de crisis con el comité ejecutivo; R38 Revisión del seguro cibernético |\n| 9 | 22 | R12 Comité de ciberriesgo; R13 Reporte al directorio o a su comité; R14 Revisión trimestral de OKR y hoja de ruta; R15 Nota trimestral de amenazas e industria; R16 Recertificación de accesos privilegiados, no humanos y de agentes; R17 Pruebas de restauración de respaldos; R18 Formación ejecutiva en ciberriesgo; R19 Revisión de calibración del juicio; R20 Seguimiento de cumplimiento y reguladores; R25 Ciclo presupuestario; R27 Evaluación anual de riesgos |\n| 10 | 15 | R24 Revisión de la estrategia y la hoja de ruta; R25 Ciclo presupuestario; R49 Revisión de la organización y del modelo de servicio; R50 Revisión de la arquitectura objetivo |\n| 11 | 15 | R25 Ciclo presupuestario; R28 Reevaluación de madurez; R42 Autoevaluación de la gestión; R46 Revisión de la carta y del mandato |\n| 12 | 28 | R12 Comité de ciberriesgo; R13 Reporte al directorio o a su comité; R14 Revisión trimestral de OKR y hoja de ruta; R15 Nota trimestral de amenazas e industria; R16 Recertificación de accesos privilegiados, no humanos y de agentes; R17 Pruebas de restauración de respaldos; R18 Formación ejecutiva en ciberriesgo; R19 Revisión de calibración del juicio; R20 Seguimiento de cumplimiento y reguladores; R21 Revisión semestral del programa con el sponsor; R22 Ejercicio de mesa del equipo de respuesta; R23 Revisión semestral con la gestión de riesgos de la empresa; R26 Revisión y ratificación del apetito; R43 Informe anual de gobierno y gestión; R44 OKR y metas del año siguiente; R45 Revisión del modelo operativo; R47 Cierre del año con el equipo |\n\n## Agendas tipo\n\n**Comité de ciberriesgo (R12, trimestral, 90 minutos).** 1) Decisiones pendientes y acciones del comité anterior. 2) Riesgo frente al apetito: riesgos fuera de tolerancia, tendencia y escalamientos (K25, K08). 3) Aceptaciones y excepciones por vencer (K04, K63). 4) Dueños de riesgo y decisiones tomadas por el rol con autoridad (K09, KSG03). 5) Indicadores de gobierno del trimestre. 6) Decisiones requeridas, con alternativas. 7) Acta, responsables y fechas.\n\n**Comité operativo de seguridad (R06, mensual, 60 minutos).** 1) Incidentes y exposición del mes. 2) Indicadores de gestión del tablero (regla de revisión). 3) Avance de la hoja de ruta y bloqueos. 4) Hallazgos de auditoría y de reguladores. 5) Acciones y responsables.\n\n**Reporte al directorio (R13, trimestral).** 1) Mensaje principal en una frase. 2) Riesgo frente al apetito y su tendencia (Q1). 3) ¿Estamos mejorando? (Q2). 4) Inversión y su efecto (Q3). 5) Preparación ante una interrupción (Q4). 6) Gobierno con evidencia y cumplimiento de lo prometido (Q5 y Q6). 7) Decisiones que se piden al directorio.\n\n**Revisión anual (R42 a R46, último mes del ejercicio).** Autoevaluación de la gestión con el libro de evaluación (KSG05), informe anual de gobierno y gestión, OKR y metas del año siguiente, revisión del modelo operativo y de la carta y el mandato.\n\n## Regla de revisión de indicadores\n\n- **R06 · Gestión.** Comité operativo de seguridad (mensual): revisa los indicadores de gestión en uso.\n- **R12 · Gobierno.** Comité de ciberriesgo (trimestral): revisa los indicadores de gobierno en uso.\n- **R08 · Tablero mensual.** Tablero mensual de métricas: todos los indicadores del tablero con frecuencia mensual.\n- **R13 · Directorio.** Reporte trimestral al directorio: indicadores de las preguntas Q1 a Q6.\n\n## Transición del año 1 al régimen\n\nDurante el año 1 los rituales se instalan en el orden del Plan 365 (columna «Se instala con»). Al cierre del año (H365) se fija el calendario fiscal del año 2, se aprueban los OKR de régimen (R44) y se revisa el propio modelo (R45). Desde entonces, la evaluación anual (R42) usa el mismo libro de evaluación y la misma escala, para que la evolución sea comparable.\n\n## Mínimo viable\n\nCuando el equipo o el contexto no permiten sostener todo el ciclo, se mantienen al menos los rituales marcados como mínimo viable: R01 Diario de decisiones del CISO; R02 Conversaciones 1:1 con los líderes del equipo; R03 Revisión semanal de amenazas, exposición e incidentes; R04 Vigilancia y escalamiento de eventos; R05 Reunión mensual con todo el equipo; R06 Comité operativo de seguridad; R08 Tablero mensual de métricas; R09 Revisión de riesgos, aceptaciones y excepciones por vencer; R10 Seguimiento del presupuesto con finanzas; R12 Comité de ciberriesgo; R13 Reporte al directorio o a su comité; R14 Revisión trimestral de OKR y hoja de ruta; R16 Recertificación de accesos privilegiados, no humanos y de agentes; R17 Pruebas de restauración de respaldos; R20 Seguimiento de cumplimiento y reguladores; R21 Revisión semestral del programa con el sponsor; R22 Ejercicio de mesa del equipo de respuesta; R24 Revisión de la estrategia y la hoja de ruta; R25 Ciclo presupuestario; R26 Revisión y ratificación del apetito; R27 Evaluación anual de riesgos; R28 Reevaluación de madurez; R29 Revisión anual de políticas; R30 Actualización de obligaciones y calendario regulatorio; R31 Plan anual de aseguramiento con auditoría interna; R32 Actualización del BIA y de los activos críticos; R33 Ejercicio de crisis con el comité ejecutivo; R34 Prueba anual de continuidad y recuperación; R35 Pruebas de controles y de penetración; R36 Evaluación anual de terceros críticos; R40 Plan de capacidades y desarrollo del equipo; R41 Plan anual de conducta segura; R42 Autoevaluación de la gestión; R43 Informe anual de gobierno y gestión; R44 OKR y metas del año siguiente; R45 Revisión del modelo operativo; R46 Revisión de la carta y del mandato; R47 Cierre del año con el equipo; R51 Revisión posterior a incidentes significativos; R52 Evaluación de seguridad de iniciativas y cambios significativos; R53 Análisis de impacto de cambios regulatorios; R54 Aceptación de riesgo o excepción a política.\n\n## Vía negativa: qué dejar de hacer\n\n- Comités que solo informan actividad y no deciden.\n- Indicadores que nadie revisa o que se revisan con menos frecuencia que la que se miden.\n- Excepciones y aceptaciones de riesgo sin vencimiento.\n- Reportes al directorio sin decisiones pedidas.\n- Rituales que se suspenden ante cada urgencia.\n\n\n---\n@SCavanna · Principal CSA Security · Microsoft MCSA · Noviembre de 2026 · Propuesta sujeta a validación y a ajustes por organización.\n"}, {"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_04_Guia_de_Evaluacion_y_Entrevistas_v1.0.md", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_04_Guia_de_Evaluacion_y_Entrevistas_v1.0.md", "ext": ".md", "sizeKB": 37.0, "content": "# Modelo Operativo CISO 365 · 04 · Guía de evaluación y entrevistas\n\n**AI CISO Atlas · v1.0 · 10 de noviembre de 2026** · Cómo evaluar la gestión de un CISO y descubrir áreas de mejora y servicios.\n\n\n## 1. Ética y alcance\n\n- **Evalúa el sistema, no a la persona.** Se evalúa el sistema de gobierno y gestión que el CISO lidera, con evidencia. No es una evaluación de desempeño individual ni reemplaza procesos de recursos humanos.\n- **No es una auditoría ni una certificación.** Un nivel alto no equivale a cumplimiento normativo.\n- **Confidencialidad.** Respuestas y evidencias son información sensible de la organización evaluada.\n- **Contexto.** La exigencia depende de los días en el cargo: no se le pide al día 100 lo que corresponde al día 365.\n\n## 2. Modos de uso\n\n| Modo | Quién | Cuándo | Resultado |\n|---|---|---|---|\n| Autoevaluación | CISO y su equipo | Cada año (ritual R42) y en H100 como línea base | Nivel de evidencia por práctica (KSG05) y plan de mejora |\n| Evaluación externa | Asesor independiente | A pedido del sponsor, del comité o del directorio | Informe de evaluación con evidencia y recomendaciones |\n| Entrevista de descubrimiento | Asesor o consultor | Antes de proponer servicios | Brechas priorizadas y servicios sugeridos |\n\n## 3. Escala de evidencia\n\n| Nivel | Nombre | Qué hay que ver |\n|---|---|---|\n| 0 | No definido | No existe o existe solo de palabra. |\n| 1 | Documentado | Está escrito y aprobado, pero no se aplica de forma consistente. |\n| 2 | Implementado | Se aplica en la mayoría de los casos y hay registros. |\n| 3 | Probado | Se probó (ejercicio, auditoría, muestra) y funciona; para este nivel, al menos dos fuentes independientes. |\n| 4 | Adaptativo | Se mejora con lo aprendido y se anticipa a cambios del contexto; también con dos fuentes independientes. |\n\n## 4. Reglas\n\n- Dos prácticas por unidad GM-24 y tres de la práctica del CISO; cuando una unidad fusiona unidades del programa de 32 de la formación, cada unidad de origen queda cubierta por al menos una práctica (G6.2: ética y medición; M3.2: selección y evaluación de controles; M6.2: redes, nube, OT, IA, desarrollo seguro y cadena de suministro).\n- La evidencia vale más que la declaración: se puntúa lo que la evidencia sostiene.\n- Lo no evaluado se deja en blanco, no en cero.\n- Un cero en una práctica crítica no se compensa con promedios: el libro lo advierte.\n- Cada práctica tiene un hito en el que debería estar instalada y un nivel mínimo esperado; con los días en el cargo, el libro calcula si ya es exigible y si cumple.\n\n## 5. Procedimiento\n\n1. Acordar alcance, interlocutores y confidencialidad con el sponsor.\n2. Pedir la evidencia mínima (carta, actas, registro de riesgos, tablero, plan de respuesta, resultados de pruebas).\n3. Entrevistar por interlocutor con la guía de preguntas; registrar notas y la preparación de la respuesta (0 a 4).\n4. Puntuar cada práctica con la escala de evidencia y registrar la evidencia revisada.\n5. Revisar resultados por línea de trabajo y por hito, y las prácticas críticas en nivel 0.\n6. Priorizar las 10 brechas ponderadas más altas (hoja Plan de mejora) y vincularlas a servicios.\n7. Presentar el informe y acordar acciones, responsables y fechas.\n\n## 6. Prácticas evaluadas\n\n| ID | Línea | Práctica | Hito | Nivel mínimo | Peso | Indicador de verificación | Señal de alerta |\n|---|---|---|---|---|---|---|---|\n| EV01 | G1 · Base estratégica y contextual | Mandato y carta de la función acordados por escrito y revisados cada año | H100 | 2 | 3 | K14; KSG03 | El alcance se deduce del organigrama; el CISO no accede al directorio; reporta a quien opera lo que debe supervisar sin contrapesos. |\n| EV02 | G1 · Base estratégica y contextual | Contexto organizacional y cultura diagnosticados y usados para priorizar | H60 | 2 | 3 | K21 | Lista de sistemas sin vínculo con procesos; el dueño de todo es tecnología. |\n| EV03 | G1 · Base estratégica y contextual | Estrategia en una página, ligada a objetivos del negocio, con 3 a 5 prioridades | H100 | 2 | 3 | K17 | La estrategia es una lista de proyectos tecnológicos o tiene más de siete prioridades. |\n| EV04 | G1 · Base estratégica y contextual | Inversión trazada a riesgos: inversión, capacidad y riesgo reducido | H180 | 2 | 2 | K17; K19 | Presupuesto por histórico y renovaciones; nadie mide el beneficio. |\n| EV05 | G2 · Marcos normativos y políticos | Marco de referencia elegido y adaptado, con perfil actual y objetivo | H60 | 2 | 2 | K22 | Puntajes sin evidencia; cambio de marco cada año; perfil objetivo nunca aprobado. |\n| EV06 | G2 · Marcos normativos y políticos | Reevaluación anual con el mismo método y validación independiente periódica | H365 | 3 | 2 | K22; KSG05 | La madurez sube sin cambios en los controles; la autoevaluación no se contrasta. |\n| EV07 | G2 · Marcos normativos y políticos | Marco de políticas con jerarquía, dueños, vigencia y aplicabilidad probada (incluye IA) | H180 | 2 | 2 | K63 | Políticas copiadas de plantillas, vencidas o que nadie sabe cuál rige. |\n| EV08 | G2 · Marcos normativos y políticos | Excepciones justificadas, con dueño, compensación y vencimiento | H180 | 2 | 2 | K63 | Excepciones permanentes o aprobadas por el área técnica. |\n| EV09 | G3 · Entorno legal y de cumplimiento | Obligaciones y plazos de notificación inventariados, con dueño | H60 | 2 | 3 | K61; K57 | No se conocen los plazos; legal se entera tarde. |\n| EV10 | G3 · Entorno legal y de cumplimiento | Requisitos de seguridad de clientes y contratos cumplidos en plazo | H270 | 2 | 1 | K23 | Se firman cláusulas sin consultar y se descubren en una auditoría del cliente. |\n| EV11 | G3 · Entorno legal y de cumplimiento | Obligaciones mapeadas a controles con evidencia vigente | H270 | 2 | 2 | K57 | La evidencia se fabrica para la auditoría. |\n| EV12 | G3 · Entorno legal y de cumplimiento | Hallazgos cerrados en plazo y plan de aseguramiento coordinado | H180 | 2 | 2 | K59 | Reprogramaciones sucesivas sin aceptación formal del riesgo. |\n| EV13 | G4 · Gobernanza y apetito de riesgo | Comité de ciberriesgo con mandato, calendario, actas y decisiones | H180 | 2 | 3 | K14; KSG02 | El comité es informativo; no asisten los titulares; no hay decisiones registradas. |\n| EV14 | G4 · Gobernanza y apetito de riesgo | Dueños de riesgo en el negocio, con matriz RACI aprobada | H180 | 2 | 3 | K09; KSG03 | Todos los riesgos tienen al CISO o a tecnología como dueño. |\n| EV15 | G4 · Gobernanza y apetito de riesgo | Apetito y tolerancias aprobados, accionables y ratificados cada año | H180 | 2 | 3 | K25 | Apetito genérico («bajo») sin umbrales; nadie lo usa para decidir. |\n| EV16 | G4 · Gobernanza y apetito de riesgo | Riesgo residual comparado con el apetito; desvíos con plan o aceptación | H270 | 2 | 3 | K25; K08 | No se puede responder o los desvíos no se reportan. |\n| EV17 | G5 · Supervisión de la gestión de riesgos | Escenarios prioritarios con impacto estimado en rangos y supuestos explícitos | H60 | 2 | 3 | K26 | Mapas de calor sin supuestos o cifras precisas sin rango. |\n| EV18 | G5 · Supervisión de la gestión de riesgos | Pronósticos registrados y calibración del juicio revisada | H365 | 1 | 1 | K01 | No existe registro; todo error se atribuye a la mala suerte. |\n| EV19 | G5 · Supervisión de la gestión de riesgos | Aceptaciones de riesgo con alternativas, autoridad correcta, compensaciones y vencimiento | H180 | 2 | 3 | K04; KSG03 | Aceptaciones firmadas por el área técnica, sin vencimiento ni compensación. |\n| EV20 | G5 · Supervisión de la gestión de riesgos | Transferencia revisada: seguro con coberturas, exclusiones y requisitos frente a controles reales | H270 | 2 | 1 | K24 | La póliza se renueva sin revisar requisitos ni exclusiones. |\n| EV21 | G6 · Liderazgo, comunicación y medición | Reporte al directorio con riesgo frente al apetito, tendencia, incertidumbre y decisiones | H180 | 2 | 3 | K58; K14 | Reportes de actividad técnica; el directorio no decide | 4 | 2 | 10 de 10 |\n| M1.1 | Desarrollo, Gestión y Operaciones del Programa de Seguridad | 12 | 4 | 2 | 10 de 10 |\n| M1.2 | Gestión Financiera, Liderazgo de Equipo y Capacitación | 17 | 9 | 2 | 10 de 10 |\n| M2.1 | Gestión de Activos y Seguridad del Ciclo de Vida de los Datos | 3 | 0 | 2 | 10 de 10 |\n| M2.2 | Gestión de Identidad y Acceso (IAM) y Principios de Confianza Cero | 4 | 1 | 2 | 10 de 10 |\n| M3.1 | Arquitectura de Seguridad, Ingeniería y Diseño (Incl. Zero Trust) | 2 | 2 | 2 | 10 de 10 |\n| M3.2 | Selección, Implementación y Evaluación de Controles | 2 | 1 | 2 | 10 de 10 |\n| M4.1 | Operaciones de Seguridad, Monitorización e Inteligencia | 3 | 1 | 2 | 10 de 10 |\n| M4.2 | Gestión de Amenazas, Vulnerabilidades y Riesgos Emergentes | 3 | 2 | 2 | 10 de 10 |\n| M5.1 | Planificación y Preparación (Incl. BIA) | 6 | 3 | 2 | 10 de 10 |\n| M5.2 | Ejecución, Post-Mortem y Comunicación | 2 | 1 | 2 | 10 de 10 |\n| M6.1 | Continuidad, DRP y Resiliencia Operativa | 2 | 2 | 2 | 10 de 10 |\n| M6.2 | Seguridad en Redes, Nube, Tecnologías Emergentes y SCRM | 10 | 3 | 2 | 10 de 10 |\n\nLos 240 conceptos de GM-24 quedan ejercitados por al menos una actividad: 149 como concepto principal y 91 como complementario. La línea transversal J (juicio y práctica del CISO) agrega 7 actividades y 3 prácticas.\n\n## 2. Distribución por territorio del AI CISO Atlas y por función de NIST CSF 2.0\n\n| Territorio | Actividades |\n|---|---|\n| T01 · SELF & JUDGMENT | 7 |\n| T02 · LEADERSHIP & ORGANIZATION | 23 |\n| T03 · STRATEGY & BUSINESS | 23 |\n| T04 · RISK & RESILIENCE | 23 |\n| T05 · SECURITY ARCHITECTURE | 14 |\n| T06 · SECURITY OPERATIONS | 7 |\n| T07 · AI & AUTONOMOUS SYSTEMS | 3 |\n| T08 · TRUST & ASSURANCE | 30 |\n\n| Función NIST CSF 2.0 | Actividades |\n|---|---|\n| GV · Govern | 82 |\n| ID · Identify | 18 |\n| PR · Protect | 19 |\n| DE · Detect | 2 |\n| RS · Respond | 7 |\n| RC · Recover | 2 |\n\n## 3. Indicadores\n\nLos 70 indicadores del catálogo de KPIs y OKRs v1.1 están  Workbook Ejecutivo para el CISO Industrial — Programa de acompañamiento estratégico de 12 meses. | Trimestres Comprender, Organizar, Ejecutar, Demostrar; 15 cuestionamientos; cuatro preguntas del directorio; ejercicios por trimestre. | Orientado a minería, energía y oil & gas; las metas numéricas de ese documento no se trasladaron sin revisión. |\n| F08 | Cavanna, S. (2026). Marco Maestro de Excelencia Operacional para la Oficina del CISO. | Tareas de gobierno no delegables, frecuencias por función NIST CSF 2.0, comité directivo, reporte en tres altitudes. | Las cifras de mercado de ese documento no se usan aquí. |\n| F09 | TheNextCISO GM-24 — Documento Maestro (nov-2026), 240 ideas centrales para ensayos y Banco Mayéutico v2.0. | Líneas de trabajo (12 ejes, 24 unidades), conceptos ejercitados por cada actividad, frontera gobierno–gestión. | Correspondencias editoriales; no son equivalencias oficiales de ISACA ni de NIST. |\n| F10 | AI CISO Atlas — Taxonomía v5.3 (territorios X, dominios Y, funciones Z, dimensión evolutiva H). | Clasificación de cada actividad por territorio, dominio y función. | Las subfunciones v5.3 no se infieren: se usa la función NIST CSF 2.0 y la categoría. |\n| F11 | AI CISO Atlas — KPIs y OKRs del CISO de empresa de frontera v1.1 (10-nov-2026; v1.0 del 9-nov-2026 integrada con este modelo). | Indicadores K01–K64 y KSG01–KSG06, estadios E1–E5, OKR de régimen (año 2 en adelante) y OKR del año 1 usados en el plan y en el tablero. | Línea base propuesta; las metas son de referencia y deben ajustarse. |\n| F12 | Marco «99 + 99 preguntas del CISO» v2.0 y «99 preguntas que le harán al CISO» v1.1 (6-nov-2026). | Dominios A01–B11 por actividad; preguntas C01–C11 que el CISO debe poder responder en cada hito. | Revalidar tras Ignite (17 al 20 de noviembre de 2026) y COBIT 7. |\n| F13 | Biblioteca CISO de Frontera (8-nov-2026): modelos mentales, sesgos, prácticas de decisión y funciones ejecutivas; Programa de 1.200 horas. | Modelo mental, práctica de decisión y sesgo a vigilar por actividad y por fase. | Definiciones de la biblioteca; algunas son derivadas conservadoras. |\n| F14 | NIST (2024). The NIST Cybersecurity Framework (CSF) 2.0, CSWP 29 (26-2-2024). | Funciones GV, ID, PR, DE, RS, RC y 22 categorías usadas para clasificar actividades. | Se mapean categorías, no subcategorías; no certifica cumplimiento. |\n| F15 | Microsoft Learn. Microsoft Security Adoption Framework (SAF), actualizado el 6-11-2026; CISO Workshop y talleres SAF. | Referencia de apoyo para servicios (uso interno del asesor). | Disponibilidad y elegibilidad según contrato; verificar vigencia antes de proponer. |\n| F16 | Rehman, R. (2021). CISO MindMap 2021. | Lista de responsabilidades del CISO usada como control de completitud. | Mapa de responsabilidades, no un plan. |\n| F17 | U.S. Department of Energy (2022). Cybersecurity Capability Maturity Model (C2M2) v2.1. | Alternativa de marco de madurez para energía y OT. | Opcional según sector. |\n\nLas guías de terceros (Gartner, CLI, Cynomi y otras) se usan como estructura y se citan; su contenido se adapta con palabras propias y no se reproduce.\n\n## 5. Silencios y límites\n\n- **Duración de las fases.** Los días de cada fase son normas de diseño derivadas de guías de 100 días (F01, F02, F04, F05) y del programa de 12 meses (F07); no hay evidencia empírica en el corpus sobre la duración óptima de cada fase.\n- **Antigüedad de las guías de terceros.** Las guías de 100 días de Gartner (2021) y del Cyber Leadership Institute (2019) son anteriores a NIST CSF 2.0 y a la IA agéntica; se usaron como estructura, no como fuente de plazos ni de contenido técnico.\n- **Metas de los indicadores.** Las metas del año 1 (etapa E3) y del año 2 (etapa E4) provienen del catálogo de KPIs v1.0 del AI CISO Atlas, que es una línea base propuesta; no son benchmarks sectoriales validados.\n- **Naturaleza del instrumento de evaluación.** El instrumento evalúa el sistema de gobierno y gestión con evidencia; no es una certificación, no reemplaza una auditoría y no es una evaluación de desempeño individual.\n- **Correspondencias editoriales.** Las correspondencias con GM-24, AI CISO Atlas, NIST CSF 2.0 y los dominios 99 + 99 son editoriales; no son equivalencias oficiales de ISACA ni de NIST.\n- **Subfunciones del Atlas.** Las 32 subfunciones editoriales v5.3 no se infirieron; cada actividad se clasifica por función y categoría de NIST CSF 2.0 hasta sincronizar el catálogo canónico.\n- **Regulación por jurisdicción.** El modelo no reemplaza un análisis legal por país y sector; los plazos de notificación deben salir del inventario de obligaciones de cada organización.\n- **Referencias de Microsoft.** Las referencias a CISO Workshop, talleres SAF, MCRA y otros recursos son de uso interno del asesor; no implican disponibilidad, elegibilidad contractual ni precios.\n- **Documentos no legibles.** Los documentos «Formación CISO: Gobierno y Gestión (versión actualizada)» del OneDrive tienen una etiqueta de confidencialidad que impide su lectura automática; el modelo se apoya en el Documento Maestro GM-24 y en los 240 pre-ensayos.\n- **Revalidación pendiente.** El marco 99 + 99 y las referencias de seguridad de IA deben revalidarse después de Microsoft Ignite (17 al 20 de noviembre de 2026) y de la publicación de COBIT 7 (19 de noviembre de 2026).\n- **Calendario fiscal.** El año 1 se mide en días desde la asunción; la transición al calendario fiscal del año 2 requiere una decisión local que el modelo solo sugiere.\n- **Conceptos GM-24 no ejercitados.** Algunos conceptos GM-24 no tienen una actividad explícita en el año 1; se listan en la hoja Conceptos GM-24 como candidatos para el año 2 o para formación.\n\n---\n@SCavanna · Principal CSA Security · Microsoft MCSA · Noviembre de 2026 · Propuesta sujeta a validación y a ajustes por organización.\n"}, {"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_07_Sistema_de_Medicion_KPIs_y_OKR_v1.0.md", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_07_Sistema_de_Medicion_KPIs_y_OKR_v1.0.md", "ext": ".md", "sizeKB": 21.9, "content": "# Modelo Operativo CISO 365 · 07 · Sistema de medición: KPIs y OKR\n\n**AI CISO Atlas · v1.0 · 10 de noviembre de 2026** · Relación con el catálogo de KPIs y OKRs, indicadores del sistema de gestión, tablero y OKR del año 1.\n\n\n## 1. La relación con el catálogo de KPIs y OKRs\n\nEl catálogo y el plan se complementan en tres capas:\n\n| Capa | Responde | Dónde |\n|---|---|---|\n| Catálogo de KPIs y OKRs | Qué se mide: definición, fórmula, estadios E1 a E5, umbrales, OKR de referencia y arreglos por sector | AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.1_2026-11-10.xlsx |\n| Plan 365 y ciclo anual | Cuándo y cómo se instala, se mide, se revisa y se compromete cada indicador | AI_CISO_Atlas_CISO365_Plan_y_Ciclo_Anual_v1.0.xlsx (hojas Plan 365, Ciclo anual, Indicadores del plan y OKR del año 1) |\n| Tablero de rendición de cuentas | Cómo se rinde cuentas: hitos, indicadores por pregunta del directorio y OKR del año 1 | AI_CISO_Atlas_CISO365_Tablero_Rendicion_de_Cuentas_v1.0.xlsx |\n\n| Pieza del plan | Relación con los indicadores |\n|---|---|\n| 130 actividades | 116 declaran los indicadores que instalan o usan (columna Indicadores del Plan 365). |\n| 54 rituales | 54 declaran los indicadores que revisan; además rige la regla de revisión (sección 7). |\n| 51 prácticas de evaluación | Todas tienen indicador de verificación. |\n| 7 hitos con 40 criterios | KSG01 mide su cumplimiento; el criterio H180-4 exige el tablero v1 con línea base y metas, y el H100-4, los OKR del año 1. |\n| Tablero del año 1 | 39 indicadores agrupados en seis preguntas del directorio (Q1 a Q6). |\n| OKR del año 1 | 6 objetivos y 18 resultados clave, alineados a los hitos. |\n| 18 servicios | Cada servicio declara los indicadores que mueve. |\n\n## 2. Qué mostró la validación y qué se corrigió\n\n| Hallazgo con el catálogo v1.0 | Corrección (catálogo v1.1 y libros del plan) nte al phishing | ≥ 50% | ACT-055; ACT-087 | R06 · R08 | Identidad y acceso |\n| A1-O6 · Gobernar la IA y los agentes antes de escalarlos. | H365 | A1-O6-KR1 · Llevar «Inventario de sistemas de IA y agentes» a 50% o más (estadio E3). | K49 · Inventario de sistemas de IA y agentes | ≥ 50% | ACT-043 | R08 · R37 | Responsable de IA y CISO |\n| A1-O6 · Gobernar la IA y los agentes antes de escalarlos. | H365 | A1-O6-KR2 · Llevar «Agentes con dueño humano y autoridad delegada acotada» a 50% o más (estadio E3). | K50 · Agentes con dueño humano y autoridad delegada acotada | ≥ 50% | ACT-083; ACT-093 | R16 · R37 | Dueños de procesos con agentes |\n| A1-O6 · Gobernar la IA y los agentes antes de escalarlos. | H365 | A1-O6-KR3 · Llevar «Casos de uso de IA con evaluación de riesgo e impacto previa» a 60% o más (estadio E3). | K51 · Casos de uso de IA con evaluación de riesgo e impacto previa | ≥ 60% | ACT-083 | R37 | Responsable de IA y CISO |\n\n## 7. Reglas\n\n**Metas por horizonte.** Año 1: umbral E3 del catálogo (mínimo aceptable), o E4 si la línea base ya alcanza E3. Año 2 en adelante: E4 (meta por defecto). Las metas son de referencia y se calibran con datos propios.\n\n**Regla de revisión.** Cada indicador en uso se revisa al menos con la frecuencia con que se mide:\n\n- R06 · Gestión: Comité operativo de seguridad (mensual): revisa los indicadores de gestión en uso.\n- R12 · Gobierno: Comité de ciberriesgo (trimestral): revisa los indicadores de gobierno en uso.\n- R08 · Tablero mensual: Tablero mensual de métricas: todos los indicadores del tablero con frecuencia mensual.\n- R13 · Directorio: Reporte trimestral al directorio: indicadores de las preguntas Q1 a Q6.\n\n**Cumplimiento de un hito.** Un criterio cumplido suma 1, uno parcial 0,5 (parámetro); el hito se considera cumplido con el 80% de sus criterios (parámetro), valor que también usan los OKR del año 1.\n\n**Unidades.** En Excel los porcentajes se guardan como fracción con formato de porcentaje (75% = 0,75); en los JSON, de 0 a 100.\n\n## 8. Uso en la evaluación y en las entrevistas\n\n- KSG05 es el resultado de la evaluación de la gestión (nivel promedio de evidencia de las prácticas); su línea base se toma en H100 y se compara cada año en R42.\n- Las prácticas EV24 (rendición de cuentas anual), EV23 (tablero), EV13 (comité), EV14, EV19 y EV01 (autoridad y dueños de riesgo) y EV06 (reevaluación anual) piden como evidencia los indicadores KSG correspondientes.\n- En las entrevistas, la pregunta de fondo para el CISO y el sponsor es la de Q6: ¿qué se prometió, qué se cumplió y qué se renegoció a tiempo?\n- Cada servicio sugerido declara los indicadores que mueve: el efecto de una asesoría se mide con los mismos indicadores del tablero.\n\n## 9. Dónde está cada cosa\n\n| Libro | Hoja | Contenido |\n|---|---|---|\n| AI_CISO_Atlas_CISO365_Plan_y_Ciclo_Anual_v1.0.xlsx | Indicadores del plan | 70 indicadores con actividades, primera medición, hito, rituales, coherencia, prácticas, metas y OKR |\n| AI_CISO_Atlas_CISO365_Plan_y_Ciclo_Anual_v1.0.xlsx | OKR del año 1 | Definición de los 18 resultados clave, con actividades y rituales |\n| AI_CISO_Atlas_CISO365_Tablero_Rendicion_de_Cuentas_v1.0.xlsx | Indicadores | Tablero del año 1 (39 indicadores) con línea base y valores por hito |\n| AI_CISO_Atlas_CISO365_Tablero_Rendicion_de_Cuentas_v1.0.xlsx | OKR del año 1 | Seguimiento: meta sugerida, valor actual, avance y estado |\n| AI_CISO_Atlas_CISO365_Tablero_Rendicion_de_Cuentas_v1.0.xlsx | Resumen | Síntesis por hito, por pregunta del directorio y por objetivo |\n| AI_CISO_Atlas_CISO365_Evaluacion_y_Entrevistas_v1.0.xlsx | Resultados | KSG05 y resultados por línea y por hito |\n| AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.1_2026-11-10.xlsx | KPI_Sistema_Gestion · OKR_Anio1 · Plan365_Integracion · Cambios_v1.1 | Definiciones, OKR del año 1, integración y registro de cambios |\n\n\n---\n@SCavanna · Principal CSA Security · Microsoft MCSA · Noviembre de 2026 · Propuesta sujeta a validación y a ajustes por organización.\n"}, {"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_Catalogo_v1.0.json", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_Catalogo_v1.0.json", "ext": ".json", "sizeKB": 496.2, "content": null}, {"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_Evaluacion_y_Entrevistas_v1.0.xlsx", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_Evaluacion_y_Entrevistas_v1.0.xlsx", "ext": ".xlsx", "sizeKB": 71.2, "content": null}, {"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_Plan_y_Ciclo_Anual_v1.0.xlsx", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_Plan_y_Ciclo_Anual_v1.0.xlsx", "ext": ".xlsx", "sizeKB": 252.6, "content": null}, {"group": "Plan Anual CISO 365 (v1.0)", "name": "AI_CISO_Atlas_CISO365_Tablero_Rendicion_de_Cuentas_v1.0.xlsx", "relHref": "./CISO_365_Plan_Anual/AI_CISO_Atlas_CISO365_Tablero_Rendicion_de_Cuentas_v1.0.xlsx", "ext": ".xlsx", "sizeKB": 67.6, "content": null}, {"group": "Catálogo KPIs y OKRs CISO de Frontera (v1.0 / v1.1)", "name": "AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_Guia_v1.0.md", "relHref": "./KPIs_y_OKRs_CISO_Frontera/AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_Guia_v1.0.md", "ext": ".md", "sizeKB": 189.9, "content": "# AI CISO Atlas · KPIs y OKRs del CISO de empresa de frontera\n\n**Guía de uso y referencia · v1.0 · 9 de noviembre de 2026**  \nAcompaña al libro de Excel *AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.0_2026-11-09.xlsx* y al catálogo en JSON *AI_CISO_Atlas_KPIs_OKRs_Catalogo_v1.0.json*.\n\n> **Estado:** baseline editorial reutilizable. Los umbrales de los estadios son referencias para calibrar con datos propios, no benchmarks oficiales. Las correspondencias con marcos son editoriales, no equivalencias. El marco regulatorio se verificó con fuentes oficiales al 9-11-2026.\n\n## Índice\n1. Para qué sirve\n2. Cómo está construido\n3. Estrategia por territorio\n4. Estrategia por función y subfunción\n5. Los 64 KPIs\n6. Estadios de madurez y de cumplimiento\n7. Arreglos por sector\n8. OKR\n9. Cómo reutilizar el artefacto\n10. Marco regulatorio por sector\n11. Limitaciones y silencios\n12. Fuentes\n\n## 1. Para qué sirve\n\nEn la práctica, un CISO tiene que **gobernar** —definir propósito, apetito, prioridades, autoridad y supervisión— y **gestionar** —diseñar, implementar, operar, verificar, responder y mejorar—. Tiene que mostrar indicadores que prueben dos cosas a la vez: que hace bien su trabajo y que el riesgo efectivamente baja. Este artefacto ofrece un sistema de medición completo para lograrlo: estrategia por dimensión, 64 KPIs explicados, cinco estadios de madurez y de cumplimiento por KPI, arreglos por sector, OKR y un motor reutilizable para crear el arreglo de cualquier organización.\n\n**Empresa de frontera.** El Microsoft Work Trend Index 2025 describe a la «Frontier Firm» como una organización que opera con inteligencia disponible a demanda y con equipos humano-agente, donde cada persona pasa a dirigir agentes («agent boss») y aparece una métrica nueva, la relación humano-agente. Para el CISO esto agrega un territorio completo de medición —la autoridad no humana— que este catálogo trata en T07 (ocho KPIs) y en los OKR de «Evolucionar».\n\n**Gobernar y gestionar (TheNextCISO GM-24).** Cada KPI declara su *plano*: los de **Gobierno** informan decisiones de apetito, prioridad, autoridad y supervisión; los de **Gestión** informan la ejecución. Cada KPI se vincula, además, a la unidad de GM-24 donde se enseña.\n\n## 2. Cómo está construido\n\n- **64 KPIs = 8 territorios × 8 KPIs** del AI CISO Atlas 5.3 (coordenada X).\n- Por función de NIST CSF 2.0 (coordenada Z): GV 21, ID 11, PR 12, DE 5, RS 7, RC 8. Govern concentra un tercio porque el CISO gobierna antes de gestionar.\n- Las **32 subfunciones** editoriales del Atlas tienen al menos un KPI; las **24 unidades de GM-24** también.\n- Plano: 25 de gobierno y 39 de gestión. Tipo: 22 KPI, 8 KRI y 34 KCI. Orientación: 45 adelantados y 19 rezagados.\n- Tipo de medida según NIST SP 800-55v1 (2024): implementación 26, efectividad 25, eficiencia 6 e impacto 7.\n- Cada KPI tiene: qué mide, por qué importa, fórmula, unidad, polaridad, fuente de datos, ejemplo de evidencia en plataforma Microsoft, frecuencia, audiencia, correspondencias (NIST CSF 2.0, CIS Controls v8.1, ISO/IEC 27001:2022 y otros) y cinco estadios con umbrales.\n\n| Hoja del libro | Qué contiene |\n|---|---|\n| Inicio | Propósito, rutas de uso, leyenda y advertencias |\n| Resumen | Distribución y cobertura del catálogo, con gráficos |\n| Estrategia_Territorios | Estrategia por territorio |\n| Estrategia_Funciones | Estrategia por función y por subfunción |\n| Dominios | Qué debe demostrar el CISO en cada dominio |\n| Catalogo_KPI | Los 64 KPIs |\n| Estadios | E1–E5 y umbrales editables |\n| Escalas | Escalas, tipologías, GM-24 y ejes de presión |\n| Perfiles_Sector | Perfiles de presión, narrativa sectorial y parámetros |\n| Afinidades | Impulsores, aptitud para Directorio y ajustes |\n| Motor | Cálculo de puntajes y niveles |\n| Arreglos_Sector | Nivel de cada KPI por sector |\n| Paquetes_Sector | 10 KPIs de Directorio y 10 esenciales por sector |\n| OKR_Territorios / OKR_Sectores | Objetivos y resultados clave con avance automático |\n| Autoevaluacion / Tablero | Medición y tablero (caso ilustrativo precargado) |\n| Marco_Regulatorio / Fuentes | Normas y fuentes verificadas |\n| Control_Calidad | 19 controles automáticos |\n\n## 3. Estrategia por territorio\n\n### T01 · SELF & JUDGMENT\n*Criterio individual, metacognición, sesgos y decisiones.*\n\n- **Intención estratégica:** Que las decisiones de seguridad sean explícitas, calibradas y revisables, y que el CISO dedique su criterio a lo que solo él puede decidir.\n- **Pregunta del Directorio:** ¿Podemos confiar en el juicio de quien nos dice cuánto riesgo tenemos?\n- **Gobernar:** Define criterios de materialidad y escalamiento; exige que las decisiones registren alternativas; acepta riesgo con fecha de vencimiento.\n- **Gestionar:** Mantiene el registro de decisiones y de pronósticos; mide la calibración; protege la agenda del CISO para el gobierno.\n- **Riesgo que mitiga:** Sesgos (optimismo, disponibilidad, anclaje), decisiones tardías y aprendizaje que no ocurre.\n- **Señal de éxito a 12 meses:** Registro de decisiones ≥ 75%, escalamiento en plazo ≥ 90% y calibración medida cada trimestre.\n- **Trampa de medición:** Medir horas de capacitación como si fueran juicio; confundir rapidez con calidad de decisión.\n- **Unidades GM-24:** G1.1 · G4.2 · G5.1 · G5.2 · G6.2 · M1.2 · M5.2\n- **KPIs:** K01 Calibración del juicio de riesgo (puntaje de habilidad de Brier) (Gobierno); K02 Tiempo del CISO en agenda de gobierno y negocio (Gobierno); K03 Decisiones materiales con registro y revisión posterior (Gobierno); K04 Aceptaciones de riesgo con alternativas, pre-mortem y vencimiento (Gobierno); K05 Tiempo hasta la decisión ejecutiva en crisis (Gobierno); K06 Revisiones post-incidente que evalúan decisiones (Gestión); K07 Competencias de liderazgo y juicio demostradas (Gestión); K08 Escalamiento oportuno de riesgos materiales (Gobierno).\n\n### T02 · LEADERSHIP & ORGANIZATION\n*Personas, incentivos, roles, cultura, liderazgo y accountability.*\n\n- **Intención estratégica:** Distribuir la responsabilidad del riesgo en el negocio y sostener un equipo capaz, estable y preparado para la crisis.\n- **Pregunta del Directorio:** ¿Quién responde por el riesgo cibernético en cada parte del negocio y tenemos la gente para gestionarlo?\n- **Gobernar:** Asigna dueños de riesgo, incorpora objetivos de seguridad en los incentivos ejecutivos y ejerce supervisión activa desde el Directorio.\n- **Gestionar:** Desarrolla capacidades, retiene talento, organiza suplencias y ejercita la crisis con el nivel ejecutivo.\n- **Riesgo que mitiga:** Rendición de cuentas difusa, dependencia de personas clave, cultura de cumplimiento formal y fatiga del equipo.\n- **Señal de éxito a 12 meses:** ≥ 80% de procesos críticos con dueño, objetivos de seguridad en ≥ 60% de los ejecutivos y ejercicios ejecutivos según el programa anual.\n- **Trampa de medición:** Contar personas capacitadas en lugar de comportamientos (reporte, escalamiento); celebrar una baja tasa de clics sin medir los reportes.\n- **Unidades GM-24:** G4.1 · G6.1 · G6.2 · M1.2 · M5.1 · M6.1\n- **KPIs:** K09 Procesos y activos críticos con dueño de riesgo designado (Gobierno); K10 Ejecutivos con objetivos de ciberseguridad en su evaluación (Gobierno); K11 Comportamiento seguro: tasa de reporte de phishing (Gestión); K12 Cobertura de capacidades críticas del equipo de seguridad (Gestión); K13 Retención del talento crítico de seguridad (Gestión); K14 Supervisión activa del Directorio sobre el ciberriesgo (Gobierno); K15 Ejercicios de crisis con participación ejecutiva (Gobierno); K16 Roles críticos con suplente entrenado (Gestión).\n\n### T03 · STRATEGY & BUSINESS\n*Outcomes, estrategia, inversión y priorización empresarial.*\n\n- **Intención estratégica:** Que cada peso invertido en seguridad se explique por riesgo reducido u objetivo de negocio habilitado, y que la seguridad acelere iniciativas en lugar de frenarlas.\n- **Pregunta del Directorio:** ¿Qué obtenemos por lo que invertimos en seguridad y cuánto nos costaron los incidentes?\n- **Gobernar:** Aprueba el perfil objetivo, prioriza el portafolio por riesgo y fija la tolerancia anual de pérdidas.\n- **Gestionar:** Ejecuta el roadmap, cuantifica el retorno en reducción de riesgo, habilita iniciativas con rapidez y cumple los compromisos con clientes.\n- **Riesgo que mitiga:** Inversión inercial, seguridad percibida como freno y pérdida de negocios por falta de evidencia de confianza.\n- **Señal de éxito a 12 meses:** ≥ 80% del presupuesto trazado a riesgos, brecha del perfil objetivo en cierre y habilitación de iniciativas en 5 días o menos.\n- **Trampa de medición:** Tratar el presupuesto ejecutado como éxito; usar benchmarks de gasto como sustituto de la exposición propia.\n- **Unidades GM-24:** G1.2 · G2.1 · G3.1 · G6.2 · M1.1 · M3.1 · M5.1\n- **KPIs:** K17 Inversión en seguridad trazada a riesgos y objetivos del negocio (Gobierno); K18 Avance del roadmap estratégico de seguridad (Gestión); K19 Reducción de riesgo por unidad de inversión (Gobierno); K20 Tiempo de habilitación segura de iniciativas (Gestión); K21 Procesos críticos con BIA vigente y dependencias mapeadas (Gestión); K22 Resultados del perfil objetivo alcanzados (NIST CSF 2.0) (Gobierno); K23 Requisitos de seguridad de clientes y contratos cumplidos en plazo (Gobierno); K24 Pérdidas por incidentes frente a la tolerancia anual (Gobierno).\n\n### T04 · RISK & RESILIENCE\n*Exposición, escenarios, apetito, continuidad y riesgo de transición.*\n\n- **Intención estratégica:** Mantener la exposición dentro del apetito y demostrar con pruebas que la organización resiste, opera degradada y se recupera.\n- **Pregunta del Directorio:** ¿Estamos dentro del riesgo que aceptamos y cuánto tardaríamos en volver a operar?\n- **Gobernar:** Fija apetito y tolerancias, decide sobre la concentración en terceros y exige pruebas de recuperación.\n- **Gestionar:** Cuantifica escenarios, mantiene respaldos inmutables, prueba RTO y RPO, ensaya la operación degradada y gestiona a los proveedores críticos.\n- **Riesgo que mitiga:** Ransomware, caída de un proveedor crítico, sabotaje con consecuencia física y riesgo de transición (IA, nube).\n- **Señal de éxito a 12 meses:** Riesgos fuera de apetito ≤ 5%, ≥ 80% de las pruebas de recuperación dentro del RTO y respaldos inmutables en ≥ 85% de los sistemas críticos.\n- **Trampa de medición:** Pruebas de recuperación «de escritorio»; matrices de calor sin cuantificación ni tolerancias.\n- **Unidades GM-24:** G4.2 · G5.1 · M5.1 · M6.1 · M6.2\n- **KPIs:** K25 Riesgos residuales fuera del apetito (Gobierno); K26 Pérdida esperada de los escenarios prioritarios frente al apetito (Gobierno); K27 Servicios críticos concentrados en un proveedor sin alternativa (Gobierno); K28 Respaldos inmutables de sistemas críticos con restauración probada (Gestión); K29 Operación degradada probada en procesos críticos (Gestión); K30 Pruebas de recuperación que cumplen RTO y RPO (Gestión); K31 Proveedores críticos evaluados y con cláusulas de seguridad (Gestión); K32 Escenarios críticos con playbook probado (Gestión).\n\n### T05 · SECURITY ARCHITECTURE\n*Diseño de controles, Zero Trust, ingeniería y fronteras técnicas.*\n\n- **Intención estratégica:** Diseñar controles que eliminen clases enteras de ataque —identidad, configuración, segmentación, datos, software, OT— y que se mantengan por defecto.\n- **Pregunta del Directorio:** ¿Nuestra arquitectura impide los ataques más probables o solo los detecta tarde?\n- **Gobernar:** Aprueba estándares y patrones de referencia (Zero Trust, ISA/IEC 62443) y decide sobre las excepciones de diseño.\n- **Gestionar:** Implementa autenticación resistente al phishing, privilegios justo a tiempo, líneas base, segmentación, protección de datos, pipeline seguro e inventario.\n- **Riesgo que mitiga:** Robo de credenciales, movimiento lateral, configuraciones débiles, fuga de datos, compromiso de la cadena de software y sabotaje OT.\n- **Señal de éxito a 12 meses:** ≥ 80% de autenticación resistente al phishing, ≥ 75% de privilegios justo a tiempo y zonas OT críticas en su nivel de seguridad objetivo.\n- **Trampa de medición:** Medir herramientas compradas en lugar de cobertura efectiva; promedios que ocultan los activos críticos.\n- **Unidades GM-24:** M2.1 · M2.2 · M3.1 · M3.2\n- **KPIs:** K33 Autenticación resistente al phishing (Gestión); K34 Accesos privilegiados sin privilegios permanentes (JIT) (Gestión); K35 Activos conformes a la línea base de configuración segura (Gestión); K36 Segmentación de activos críticos verificada (Gestión); K37 Datos sensibles clasificados y protegidos (Gestión); K38 Aplicaciones críticas con controles automatizados en el pipeline (Gestión); K39 Cobertura del inventario de activos (TI, nube, OT e IoT) (Gestión); K40 Zonas OT e IIoT que alcanzan su nivel de seguridad objetivo (Gestión).\n\n### T06 · SECURITY OPERATIONS\n*SOC, monitoreo, investigación, respuesta y operación.*\n\n- **Intención estratégica:** Ver todo lo crítico, detectar lo relevante, contener en horas y restaurar dentro del RTO, aprendiendo de cada incidente.\n- **Pregunta del Directorio:** Si nos atacan hoy, ¿lo veríamos, lo frenaríamos y en cuánto tiempo volveríamos a la normalidad?\n- **Gobernar:** Define niveles de servicio de detección y respuesta y la priorización por exposición.\n- **Gestionar:** Opera la telemetría, la detección validada contra las amenazas del sector, el hunting, la contención, la remediación de vulnerabilidades explotadas y las acciones correctivas.\n- **Riesgo que mitiga:** Permanencia prolongada del atacante, explotación de vulnerabilidades conocidas e incidentes recurrentes.\n- **Señal de éxito a 12 meses:** MTTD ≤ 8 h, MTTC ≤ 4 h, ≥ 85% de vulnerabilidades explotadas remediadas en plazo y ≥ 70% de técnicas priorizadas validadas.\n- **Trampa de medición:** Reportar volumen de alertas o de ataques bloqueados; promedios que esconden los incidentes graves.\n- **Unidades GM-24:** M4.1 · M4.2 · M5.2 · M6.1\n- **KPIs:** K41 Cobertura de telemetría y protección de activos críticos (Gestión); K42 Tiempo medio de detección (MTTD) (Gestión); K43 Técnicas de ataque priorizadas con detección validada (Gestión); K44 Campañas de hunting que mejoran la detección (Gestión); K45 Tiempo medio de contención (MTTC) (Gestión); K46 Vulnerabilidades explotadas y exposiciones críticas remediadas en plazo (Gestión); K47 Tiempo de restauración de servicios críticos frente al RTO (Gestión); K48 Acciones correctivas post-incidente cerradas en plazo (Gestión).\n\n### T07 · AI & AUTONOMOUS SYSTEMS\n*Modelos, agentes, autonomía, herramientas y autoridad no humana.*\n\n- **Intención estratégica:** Gobernar la
