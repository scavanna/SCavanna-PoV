Mi organización.** En Perfiles_Sector, ajuste la fila «Mi organización» (presiones 1–5) y, si hace falta, la aptitud y los ajustes en Afinidades. El arreglo se recalcula solo y Paquetes_Sector lista el resultado.\n\n## 8. OKR\n\nLos OKR traducen la estrategia en compromisos con fecha. Cada resultado clave usa un KPI del catálogo con meta igual a su umbral E4 (editable). **Desde la versión 1.1, los OKR de esta sección son de régimen: rigen del año 2 en adelante. Para el primer año del CISO, ver la sección 13.3.** El avance se calcula como la fracción recorrida entre la línea base y la meta; «En camino» desde 70%.\n\n### Por territorio\n| Territorio | Objetivo | Resultados clave |\n|---|---|---|\n| T01 | Hacer explícito, calibrado y revisable el juicio de seguridad. | K03 Decisiones materiales con registro y revisión posterior: ≥ 75%<br>K08 Escalamiento oportuno de riesgos materiales: ≥ 90%<br>K01 Calibración del juicio de riesgo (puntaje de habilidad de Brier): ≥ 0,20 |\n| T02 | Distribuir la responsabilidad del ciberriesgo y sostener un equipo preparado. | K09 Procesos y activos críticos con dueño de riesgo designado: ≥ 80%<br>K10 Ejecutivos con objetivos de ciberseguridad en su evaluación: ≥ 60%<br>K16 Roles críticos con suplente entrenado: ≥ 80% |\n| T03 | Convertir la inversión en seguridad en reducción de riesgo y velocidad de negocio. | K17 Inversión en seguridad trazada a riesgos y objetivos del negocio: ≥ 80%<br>K19 Reducción de riesgo por unidad de inversión: ≥ 2x<br>K20 Tiempo de habilitación segura de iniciativas: ≤ 5 días |\n| T04 | Mantener la exposición dentro del apetito y la recuperación probada. | K25 Riesgos residuales fuera del apetito: ≤ 5%<br>K30 Pruebas de recuperación que cumplen RTO y RPO: ≥ 80%<br>K28 Respaldos inmutables de sistemas críticos con restauración probada: ≥ 85% |\n| T05 | Eliminar clases completas de ataque por diseño. | K33 Autenticación resistente al phishing: ≥ 80%<br>K34 Accesos privilegiados sin privilegios permanentes (JIT) erdo CNO 2188.\n- Normas en movimiento: Ley 21.719 (Chile) con postergación en trámite; propuestas Digital Omnibus que tocan NIS2 y DORA; ISO/IEC 27004 en revisión; reafirmación de API 1164 en votación.\n- Dominios sin KPI primario (D09, D19, D22, D23): cubiertos como secundarios.\n- La evidencia Microsoft es un ejemplo de fuente de datos; el catálogo es neutral respecto de proveedores.\n- Los estadios E1–E5 miden madurez del indicador; no son el horizonte H del Atlas (ADR-009).\n\n## 12. Fuentes\n\n- **F01** · NIST Cybersecurity Framework (CSF) 2.0, CSWP 29 · NIST · 26-2-2024. Funciones GV-ID-PR-DE-RS-RC, 22 categorías, Tiers (Partial, Risk Informed, Repeatable, Adaptive) y perfiles actual y objetivo (K22). <https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf>\n- **F02** · NIST SP 800-55v1 y v2, Measurement Guide for Information Security · NIST · 4-12-2024. Cuatro tipos de medidas: implementación, efectividad, eficiencia e impacto (columna «Tipo de medida»); programa de medición iterativo. <https://csrc.nist.gov/pubs/sp/800/55/v1/final>\n- **F03** · ISO/IEC 27004:2016 (seguimiento, medición, análisis y evaluación) · ISO/IEC JTC 1/SC 27 · 2016 (en revisión; 3.ª edición en DIS). Referencia de medición para ISO/IEC 27001, cláusula 9.1. <https://www.iso.org/standard/64120.html>\n- **F04** · CIS Critical Security Controls v8.1 · Center for Internet Security · Junio de 2024. Columna CIS; IG1 = 56 salvaguardas (153 en total). <https://www.cisecurity.org/controls/v8-1>\n- **F05** · ISO/IEC 27001:2022, Anexo A y cláusulas 4 a 10 · ISO/IEC JTC 1/SC 27 · 2022. Columna ISO/IEC 27001 (correspondencia editorial). <https://www.iso.org/standard/27001>\n- **F06** · CISA Cross-Sector Cybersecurity Performance Goals 2.0 · CISA · 11-12-2025. Metas mínimas alineadas a CSF 2.0 (K22, K33). <https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0>\n- **F07** · DOE C2M2 v2.1 · DOE CESER · Junio de 2022. Correspondencia de estadios con MIL0–MIL3. <https://www.energy.gov/ceser/c emediadas, mediana 43 días. <https://www.verizon.com/business/resources/reports/dbir/>\n- **F46** · Microsoft Digital Defense Report 2025 · Microsoft · 16-10-2025. Contexto: la MFA bloquea más del 99% de los ataques de identidad (K33). <https://blogs.microsoft.com/on-the-issues/2025/10/16/mddr-2025/>\n- **F47** · AI CISO Atlas, Taxonomía 5.3 y Core Ontology 1.0 · Proyecto AI CISO Atlas · 2026. Territorios, dominios, funciones, 32 subfunciones; entidades y relaciones.\n- **F48** · TheNextCISO GM-24, Documento Maestro · Proyecto TheNextCISO · Noviembre de 2026. Plano Gobierno/Gestión y 24 unidades G1.1–M6.2.\n\n## 13. Integración con el Modelo Operativo CISO 365 (novedades de la versión 1.1)\n\n### 13.1 Por qué hizo falta una versión 1.1\n\nEl cruce del catálogo v1.0 con el Plan 365 (130 actividades, 54 rituales, 51 prácticas de evaluación y 40 criterios de salida en 7 hitos) mostró que la relación ya existía, pero con cinco brechas:\n\n- **Uso:** 61 de 64 KPIs estaban en el plan; K08, K44, K55 no tenían actividad, ritual ni práctica.\n- **Revisión:** 15 KPIs no tenían un ritual que los revisara y 24 se revisaban con menos frecuencia que la que se miden (12 de ellos en el tablero del año 1).\n- **Horizonte:** los OKR por territorio y por sector apuntan a E4 en cuatro trimestres; el primer año empieza sin línea base y no tenía OKR propios.\n- **Sistema de gestión:** seis componentes del modelo operativo (hitos, ciclo de rituales, derechos de decisión, tablero, evaluación de prácticas y compromisos) no tenían indicador.\n- **Unidades:** el tablero del plan cargaba porcentajes de 0 a 100 y el libro, como fracción con formato de porcentaje.\n\n### 13.2 Indicadores del sistema de gestión del CISO (KSG)\n\nMiden si el modelo operativo funciona, no la postura técnica. Son universales: no participan del motor de arreglos sectoriales y se usan siempre en el primer año.\n\n| ID | Indicador | Componente del modelo | Plano · unidad GM-24 | Unidad | E3 (año 1) | E4 (año 2) | Frecuencia |\n|---|---|---|---|---|---|---|---|\n| KSG01 | Criterios de salida de los hitos cumplidos en fecha | Fases, hitos y criterios de salida | Gestión · M1.1 | % | ≥ 70% | ≥ 85% | Por hito · trimestral |\n| KSG02 | Rituales del ciclo de gobierno realizados según el calendario | Ciclo anual de gobierno y gestión | Gobierno · G4.1 | % | ≥ 70% | ≥ 85% | Trimestral |\n| KSG03 | Decisiones materiales tomadas por el rol con autoridad | Derechos de decisión | Gobierno · G1.1 | % | ≥ 60% | ≥ 80% | Trimestral |\n| KSG04 | Indicadores del tablero con línea base, dueño y fuente | Sistema de medición (tablero) | Gobierno · G6.1 | % | ≥ 60% | ≥ 80% | Trimestral |\n| KSG05 | Nivel de evidencia de las prácticas de gobierno y gestión | Evaluación de la gestión (51 prácticas) | Gobierno · G6.2 | nivel (0 a 4) | ≥ 2,0 | ≥ 3,0 | Anual · línea base en H100 |\n| KSG06 | Compromisos de rendición de cuentas cumplidos o renegociados a tiempo | Rendición de cuentas (lo prometido frente a lo cumplido) | Gobierno · G6.2 | % | ≥ 70% | ≥ 85% | Trimestral |\n\n**KSG01 · Criterios de salida de los hitos cumplidos en fecha.** Porcentaje de los criterios de salida exigibles a la fecha que se cumplieron con evidencia al llegar a su hito. En el primer año, los 40 criterios de los hitos H0 a H365 del Plan 365; desde el segundo año, los criterios de los hitos del plan anual. *Por qué importa:* El primer año se juzga por lo que quedó instalado, no por la cantidad de actividades. Medir criterios con evidencia evita confundir esfuerzo con resultado y obliga a renegociar a tiempo lo que no se cumplirá. *Fórmula:* (Criterios cumplidos + valor parcial × criterios parciales) ÷ criterios exigibles a la fecha × 100. Valor parcial por defecto: 0,5.\n\n**KSG02 · Rituales del ciclo de gobierno realizados según el calendario.** Porcentaje de los rituales programados en el período (comités, revisiones, reportes, ejercicios y ciclos anuales del calendario de gobierno) que se realizaron en la ventana prevista y dejaron acta con decisiones y acciones. *Por qué importa:* Un sistema de gobierno existe cuando sus rituales ocurren aunque haya urgencias. Si los comités se suspenden ante cada incidente, las decisiones de riesgo vuelven a tomarse por omisión. *Fórmula:* Rituales realizados en ventana y con acta ÷ rituales programados para el período × 100.\n\n**KSG03 · Decisiones materiales tomadas por el rol con autoridad.** Porcentaje de las decisiones materiales de seguridad de una muestra del período (aceptación de riesgo, excepciones, inversión, apetito, crisis, terceros y agentes de IA) que tomó el rol con autoridad según la matriz de derechos de decisión, dentro del plazo acordado. *Por qué importa:* Cuando el CISO o TI deciden riesgos que corresponden al negocio, el riesgo queda sin dueño y el CISO absorbe una responsabilidad que no le corresponde. La matriz solo vale si se respeta. *Fórmula:* Decisiones de la muestra tomadas por el rol con autoridad (A) y en plazo ÷ decisiones materiales de la muestra × 100.\n\n**KSG04 · Indicadores del tablero con línea base, dueño y fuente.** Porcentaje de los indicadores del tablero (de directorio y del CISO) con línea base medida, dueño del dato, fuente identificada y fórmula reproducible. *Por qué importa:* Una meta sin línea base es una promesa sin punto de partida. Sin dueño del dato ni fuente, el tablero se vuelve un ejercicio manual que se abandona al segundo trimestre. *Fórmula:* Indicadores del tablero con línea base, dueño, fuente y fórmula documentados ÷ indicadores del tablero × 100.\n\n**KSG05 · Nivel de evidencia de las prácticas de gobierno y gestión.** Nivel promedio de evidencia (0 No definido, 1 Documentado, 2 Implementado, 3 Probado, 4 Adaptativo) de las prácticas evaluadas en el libro de evaluación: dos por unidad de TheNextCISO GM-24 y tres de la práctica del CISO. *Por qué importa:* Resume si el sistema de gobierno y gestión existe solo en documentos o funciona y se prueba. Se informa junto con las prácticas críticas en nivel 0, que ningún promedio compensa. *Fórmula:* Promedio del nivel actual (0 a 4) de las prácticas evaluadas; se informa junto con la cantidad de prácticas críticas en nivel 0.\n\n**KSG06 · Compromisos de rendición de cuentas cumplidos o renegociados a tiempo.** Porcentaje de los compromisos asumidos ante el directorio, el sponsor o los comités (informe de los 100 días, reportes trimestrales e informe anual) con vencimiento en el período que se cumplieron en fecha o se renegociaron de manera explícita antes de vencer. *Por qué importa:* La confianza del directorio se construye cumpliendo lo prometido y avisando antes, no después. Un historial de cumplimiento es el mejor argumento para la siguiente solicitud de inversión. *Fórmula:* (Compromisos cumplidos en fecha + compromisos renegociados antes del vencimiento) ÷ compromisos con vencimiento en el período × 100.\n\n### 13.3 OKR del año 1\n\nCuatro objetivos fijos, uno por tramo del año, y dos seleccionables por sector. El objetivo A1-O1 se acuerda con el mandato (H0); los demás, en el informe de los 100 días (H100), cuya hoja de ruta ahora incluye los OKR del año 1 (criterio H100-4). Se revisan cada trimestre en el ritual R14 y se cierran en el informe anual (H365), donde también se aprueban los OKR de régimen del año 2 (R44).\n\n*Regla de metas.* Meta del año 1 = umbral E3; si la línea base ya alcanza E3, la meta pasa a E4 (un estadio por encima de la línea base). Hitos: meta de cumplimiento del hito (80% por defecto).\n\n| Objetivo | Tramo · hito | Resultados clave (meta del año 1) |\n|---|---|---|\n| **A1-O1** · Conocer la verdad del área y acordar un mandato basado en evidencia. | Días 1 a 100 (F1 a F3) · H100 | A1-O1-KR1 · H30 Cumplimiento del hito H30: ≥ 80% de los criterios del hito (parámetro del tablero)<br>A1-O1-KR2 · KSG04 Indicadores del tablero con línea base, dueño y fuente: ≥ 60%<br>A1-O1-KR3 · H100 Cumplimiento del hito H100: ≥ 80% de los criterios del hito (parámetro del tablero) |\n| **A1-O2** · Instalar el sistema de gobierno y gestión del ciberriesgo. | Días 101 a 180 (F4) · H180 | A1-O2-KR1 · KSG02 Rituales del ciclo de gobierno realizados según el calendario: ≥ 70%<br>A1-O2-KR2 · K09 Procesos y activos críticos con dueño de riesgo designado: ≥ 60%<br>A1-O2-KR3 · KSG03 Decisiones materiales tomadas por el rol con autoridad: ≥ 60% |\n| **A1-O3** · Probar que las capacidades críticas funcionan bajo presión. | Días 181 a 270 (F5) · H270 | A1-O3-KR1 · K15 Ejercicios de crisis con participación ejecutiva: ≥ 50%<br>A1-O3-KR2 · K30 Pruebas de recuperación que cumplen RTO y RPO: ≥ 60%<br>A1-O3-KR3 · K60 Controles clave con efectividad probada: ≥ 60% |\n| **A1-O4** · Rendir cuentas con evidencia y renovar el mandato. | Días 271 a 365 (F6) · H365 | A1-O4-KR1 · KSG01 Criterios de salida de los hitos cumplidos en fecha: ≥ 70%<br>A1-O4-KR2 · KSG06 Compromisos de rendición de cuentas cumplidos o renegociados a tiempo: ≥ 70%<br>A1-O4-KR3 · KSG05 Nivel de evidencia de las prácticas de gobierno y gestión: ≥ 2,0 |\n| **A1-O5** · Reducir la exposición en los escenarios de riesgo prioritarios. *(seleccionable)* | Días 61 a 365 (F3 a F6) · H365 | A1-O5-KR1 · K25 Riesgos residuales fuera del apetito: ≤ 10%<br>A1-O5-KR2 · K46 Vulnerabilidades explotadas y exposiciones críticas remediadas en plazo: ≥ 70%<br>A1-O5-KR3 · K33 Autenticación resistente al phishing: ≥ 50% |\n| **A1-O6** · Gobernar la IA y los agentes antes de escalarlos. *(seleccionable)* | Días 31 a 365 (F2 a F6) · H365 | A1-O6-KR1 · K49 Inventario de sistemas de IA y agentes: ≥ 50%<br>A1-O6-KR2 · K50 Agentes con dueño humano y autoridad delegada acotada: ≥ 50%<br>A1-O6-KR3 · K51 Casos de uso de IA con evaluación de riesgo e impacto previa: ≥ 60% |\n\n*Objetivos seleccionables.* Seleccionable: reemplazar por los OKR «Gestionar» y «Evolucionar» del sector (hoja OKR_Sectores del catálogo) con meta E3 en el año 1.\n\n### 13.4 Horizontes de los OKR\n\n| Horizonte | Hoja | Meta | Cuándo se acuerda |\n|---|---|---|---|\n| Año 1 (instalación) | OKR_Anio1 | E3, o E4 si la línea base ya alcanza E3 | H0 (A1-O1) y H100 (A1-O2 a A1-O6) |\n| Año 2 en adelante (régimen) | OKR_Territorios · OKR_Sectores | E4 (meta por defecto) | H365 del año anterior (ritual R44) |\n\n### 13.5 Regla de revisión de indicadores\n\nCada indicador en uso se revisa al menos con la frecuencia con que se mide:\n\n- **R06 · Gestión.** Comité operativo de seguridad (mensual): revisa los indicadores de gestión en uso.\n- **R12 · Gobierno.** Comité de ciberriesgo (trimestral): revisa los indicadores de gobierno en uso.\n- **R08 · Tablero mensual.** Tablero mensual de métricas: todos los indicadores del tablero con frecuencia mensual.\n- **R13 · Directorio.** Reporte trimestral al directorio: indicadores de las preguntas Q1 a Q6.\n\nResultado sobre los 70 indicadores: 35 coherentes por sus rituales explícitos y 35 coherentes gracias a la regla; ninguno queda sin revisión suficiente. El detalle está en la hoja Plan365_Integracion.\n\n### 13.6 Convención de unidades\n\nEn los libros de Excel (catálogo y tablero del plan) los porcentajes se guardan como fracción con formato de porcentaje: 75% = 0,75. En el JSON, los umbrales y metas porcentuales van de 0 a 100. Tiempos, índices y niveles conservan su unidad.\n\n### 13.7 Cambios respecto de la versión 1.0\n\n1. Nueva familia de 6 indicadores del sistema de gestión del CISO (KSG01 a KSG06), fuera del motor de arreglos.\n2. OKR del año 1: 6 objetivos y 18 resultados clave alineados a las fases y los hitos del Modelo Operativo CISO 365 (4 fijos y 2 seleccionables por sector).\n3. Regla de metas por horizonte: año 1 = E3 (o E4 si la línea base ya alcanza E3); año 2 = E4; hitos = 80% de los criterios.\n4. OKR por territorio y por sector declarados como OKR de régimen (año 2 en adelante).\n5. Matriz de integración con el Plan 365 para los 70 indicadores.\n6. Vinculación al plan de los 3 KPIs que no tenían uso: K08, K44, K55.\n7. Regla de revisión de indicadores: cubre los 15 KPIs sin ritual y los 24 que se revisaban con menos frecuencia que la que se miden.\n8. Tablero del año 1: K51 se suma a Q5; Q6 pasa a «¿Cumplimos lo que prometimos?» con KSG01 a KSG06, K02 y K01.\n9. Convención de unidades: en Excel los porcentajes son fracciones con formato de porcentaje; en este JSON van de 0 a 100.\n10. Seis controles de calidad nuevos en el libro.\n\nLa versión 1.0 se conserva sin cambios. Los 64 KPIs, sus estadios, el motor de arreglos, los paquetes por sector y el marco regulatorio no cambian.\n\n---\n@SCavanna · Principal CSA Security · Microsoft MCSA · Noviembre de 2026\n"}, {"group": "Catálogo KPIs y OKRs CISO de Frontera (v1.0 / v1.1)", "name": "AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.0_2026-11-09.xlsx", "relHref": "./KPIs_y_OKRs_CISO_Frontera/AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.0_2026-11-09.xlsx", "ext": ".xlsx", "sizeKB": 315.3, "content": null}, {"group": "Catálogo KPIs y OKRs CISO de Frontera (v1.0 / v1.1)", "name": "AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.1_2026-11-10.xlsx", "relHref": "./KPIs_y_OKRs_CISO_Frontera/AI_CISO_Atlas_KPIs_OKRs_CISO_de_Frontera_v1.1_2026-11-10.xlsx", "ext": ".xlsx", "sizeKB": 358.1, "content": null}, {"group": "Catálogo KPIs y OKRs CISO de Frontera (v1.0 / v1.1)", "name": "AI_CISO_Atlas_KPIs_OKRs_Catalogo_v1.0.json", "relHref": "./KPIs_y_OKRs_CISO_Frontera/AI_CISO_Atlas_KPIs_OKRs_Catalogo_v1.0.json", "ext": ".json", "sizeKB": 242.8, "content": null}, {"group": "Catálogo KPIs y OKRs CISO de Frontera (v1.0 / v1.1)", "name": "AI_CISO_Atlas_KPIs_OKRs_Catalogo_v1.1.json", "relHref": "./KPIs_y_OKRs_CISO_Frontera/AI_CISO_Atlas_KPIs_OKRs_Catalogo_v1.1.json", "ext": ".json", "sizeKB": 337.0, "content": null}];

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function simpleMdToHtml(md) {
  const lines = md.split(/\r?\n/);
  let html = "", inTable = false, inList = false;
  const fmtInline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim().startsWith("|") && l.trim().endsWith("|")) {
      if (inList) { html += "</ul>"; inList = false; }
      const cells = l.trim().slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^[-:\s]+$/.test(c))) continue;
      if (!inTable) {
        html += "<table><thead><tr>" + cells.map(c => `<th>${fmtInline(c)}</th>`).join("") + "</tr></thead><tbody>";
        inTable = true;
      } else {
        html += "<tr>" + cells.map(c => `<td>${fmtInline(c)}</td>`).join("") + "</tr>";
      }
      continue;
    } else if (inTable) { html += "</tbody></table>"; inTable = false; }

    if (/^#{1,4}\s+/.test(l)) {
      if (inList) { html += "</ul>"; inList = false; }
      const lvl = l.match(/^#+/)[0].length;
      html += `<h${lvl}>${fmtInline(l.replace(/^#+\s+/, ""))}</h${lvl}>`;
    } else if (l.startsWith("> ")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += `<blockquote>${fmtInline(l.slice(2))}</blockquote>`;
    } else if (l.startsWith("- ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${fmtInline(l.slice(2))}</li>`;
    } else if (l.trim() === "---") {
      if (inList) { html += "</ul>"; inList = false; }
      html += "<hr style='border:none;border-top:1px solid var(--cp-border);margin:24px 0;'>";
    } else if (l.trim()) {
      if (inList) { html += "</ul>"; inList = false; }
      html += `<p>${fmtInline(l)}</p>`;
    }
  }
  if (inTable) html += "</tbody></table>";
  if (inList) html += "</ul>";
  return html;
}

    `;

}
